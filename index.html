<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>创作工作台</title>
<style>
/* ============================================================
   全局变量 & 基础
   ============================================================ */
:root {
  --olive:#4A7C3F; --olive-dark:#3A6330; --olive-light:#E8F0E4;
  --olive-bg:#F5F7F0; --white:#FFF; --card:#FFF;
  --text:#2C2C2C; --text2:#666; --text3:#999;
  --border:#E8E8E8; --danger:#D94A4A; --danger-light:#FDEDED;
  --orange:#F0833A; --blue:#3B82F6; --purple:#8B5CF6;
  --radius:16px; --radius-sm:10px; --radius-xs:6px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font); background:#ECEDE8; color:var(--text);
  display:flex; justify-content:center; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}

/* ============================================================
   App 容器 — 手机形态
   ============================================================ */
.app{
  width:100%; max-width:430px; min-height:100vh;
  background:var(--olive-bg); position:relative; overflow-x:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.08);
}

/* ============================================================
   顶部栏
   ============================================================ */
.header{
  position:sticky; top:0; z-index:100;
  background:var(--white); padding:12px 16px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header .menu-btn{
  width:36px; height:36px; border:none; background:var(--olive-light);
  border-radius:10px; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--olive);
}
.header .title{ font-size:17px; font-weight:700; color:var(--olive); letter-spacing:.5px; }
.header .sync-btn{
  width:36px; height:36px; border:none; background:var(--olive-light);
  border-radius:10px; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--olive);
}
.header .sync-btn.loading{ animation:spin .8s linear infinite; }
@keyframes spin{ to{transform:rotate(360deg)} }

/* ============================================================
   抽屉遮罩 & 抽屉面板
   ============================================================ */
.drawer-overlay{
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,.35); z-index:200; opacity:0; pointer-events:none;
  transition:opacity .25s;
}
.drawer-overlay.open{ opacity:1; pointer-events:auto; }

.drawer{
  position:fixed; top:0; left:0; width:280px; height:100%;
  background:var(--white); z-index:210;
  transform:translateX(-100%); transition:transform .25s ease;
  display:flex; flex-direction:column; overflow-y:auto;
}
.drawer.open{ transform:translateX(0); }

.drawer-header{
  padding:20px 18px 14px;
  border-bottom:1px solid var(--border);
}
.drawer-header .brand{ font-size:20px; font-weight:700; color:var(--olive); }
.drawer-header .brand-sub{ font-size:12px; color:var(--text3); margin-top:2px; }

.drawer-nav{ padding:10px 10px; flex:1; }
.drawer-label{
  font-size:11px; color:var(--text3); text-transform:uppercase;
  letter-spacing:1px; padding:12px 10px 6px;
}
.drawer-item{
  display:flex; align-items:center; gap:10px;
  padding:11px 12px; border-radius:var(--radius-sm);
  font-size:14px; color:var(--text2); cursor:pointer;
  transition:background .15s, color .15s; margin-bottom:2px;
}
.drawer-item:hover{ background:var(--olive-light); }
.drawer-item.active{ background:var(--olive); color:#FFF; font-weight:600; }
.drawer-item .icon{ font-size:18px; line-height:1; }

.drawer-footer{
  padding:14px 18px; border-top:1px solid var(--border);
}
.drawer-footer .manage-btn{
  width:100%; padding:10px; border:1px dashed var(--border);
  border-radius:var(--radius-sm); background:transparent;
  font-size:13px; color:var(--text3); cursor:pointer;
}
.drawer-footer .manage-btn:active{ background:var(--olive-light); }

/* ============================================================
   主内容区
   ============================================================ */
.main{ padding:14px 14px 40px; }

/* ============================================================
   模块区域
   ============================================================ */
.module{ margin-bottom:18px; display:none; }
.module.active{ display:block; }

/* 模块标题 */
.module-title{
  font-size:16px; font-weight:700; margin-bottom:10px; color:var(--text);
  display:flex; align-items:center; gap:6px;
}

/* 卡片 */
.card{
  background:var(--card); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow);
  border:1px solid transparent;
}

/* ============================================================
   模块1: 每日计划（日历视图）
   ============================================================ */

/* 日历导航栏 */
.calendar-nav{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; gap:6px;
}
.calendar-nav .nav-btn{
  width:32px; height:32px; border:none; background:var(--olive-light);
  border-radius:8px; font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--olive); font-weight:700;
}
.calendar-nav .nav-btn:active{ background:var(--olive); color:#FFF; }
.calendar-nav .month-label{
  font-size:15px; font-weight:700; color:var(--text); flex:1; text-align:center;
}
.calendar-nav .today-btn{
  padding:6px 14px; border:1px solid var(--olive); background:transparent;
  border-radius:14px; font-size:12px; color:var(--olive); cursor:pointer;
  font-weight:600;
}
.calendar-nav .today-btn:active{ background:var(--olive); color:#FFF; }

/* 星期头 */
.calendar-weekdays{
  display:grid; grid-template-columns:repeat(7,1fr);
  text-align:center; margin-bottom:4px;
}
.calendar-weekdays span{
  font-size:11px; color:var(--text3); font-weight:600; padding:4px 0;
}
.calendar-weekdays span.weekend{ color:var(--orange); }

/* 日期网格 */
.calendar-grid{
  display:grid; grid-template-columns:repeat(7,1fr);
  gap:3px; margin-bottom:14px;
}
.calendar-day{
  aspect-ratio:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  border-radius:var(--radius-xs); font-size:13px;
  cursor:pointer; position:relative; color:var(--text2);
  transition:background .15s; user-select:none;
}
.calendar-day:hover{ background:var(--olive-light); }
.calendar-day.other-month{ color:var(--text3); opacity:.4; }
.calendar-day.today{
  font-weight:700; color:var(--olive);
}
.calendar-day.today::before{
  content:''; position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:32px; height:32px; border-radius:50%;
  border:2px solid var(--olive); z-index:0;
}
.calendar-day.selected{
  background:var(--olive); color:#FFF; font-weight:700;
}
.calendar-day.selected.today::before{ border-color:#FFF; }
.calendar-day .dot{
  position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%; background:var(--olive);
}
.calendar-day.selected .dot{ background:#FFF; }

/* 选中日期信息 & 进度 */
.calendar-date-info{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px; padding:8px 0;
  border-top:1px solid var(--border);
}
.calendar-date-info .date-label{
  font-size:14px; font-weight:700; color:var(--text);
}
.calendar-date-info .date-label .today-badge{
  display:inline-block; font-size:10px; background:var(--olive);
  color:#FFF; padding:1px 7px; border-radius:10px; margin-left:6px;
  font-weight:500; vertical-align:middle;
}
.calendar-reminder{
  padding:8px 12px; background:#FFF9E6; border-radius:var(--radius-sm);
  font-size:12px; color:#B45309; margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}

.progress-wrap{ margin-bottom:10px; }
.progress-bar{
  width:100%; height:6px; background:var(--olive-light);
  border-radius:3px; overflow:hidden;
}
.progress-fill{
  height:100%; background:var(--olive); border-radius:3px;
  transition:width .3s ease; width:0%;
}
.progress-text{
  display:flex; justify-content:space-between; margin-top:4px;
  font-size:11px; color:var(--text3);
}
.progress-text b{ color:var(--olive); }

/* 任务列表 */
.task-list{ display:flex; flex-direction:column; gap:2px; }
.task-row{
  display:flex; align-items:center; gap:10px;
  padding:10px 4px; border-bottom:1px solid #f5f5f5;
  transition:background .15s;
}
.task-row:last-child{ border-bottom:none; }

.task-check{
  appearance:none; -webkit-appearance:none;
  width:22px; height:22px; min-width:22px;
  border:2px solid var(--border); border-radius:50%;
  cursor:pointer; position:relative;
  transition:all .15s;
}
.task-check:checked{
  background:var(--olive); border-color:var(--olive);
}
.task-check:checked::after{
  content:"✓"; color:#FFF; font-size:11px; font-weight:700;
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
}
.task-text{
  flex:1; font-size:14px; transition:all .2s;
}
.task-row.done .task-text{
  text-decoration:line-through; color:var(--text3);
}
.task-del{
  border:none; background:transparent; color:var(--text3);
  font-size:18px; cursor:pointer; padding:4px 4px;
  border-radius:50%; width:28px; height:28px;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.task-del:active{ background:var(--danger-light); color:var(--danger); }

/* 添加任务 */
.task-add{
  display:flex; gap:8px; margin-top:10px; padding-top:10px;
  border-top:1px dashed var(--border);
}
.task-add input{
  flex:1; padding:10px 14px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:14px; outline:none;
  font-family:var(--font);
}
.task-add input:focus{ border-color:var(--olive); }
.task-add .btn{
  padding:10px 16px; background:var(--olive); color:#FFF;
  border:none; border-radius:var(--radius-sm); font-size:13px;
  font-weight:600; cursor:pointer; white-space:nowrap;
}
.task-add .btn:active{ background:var(--olive-dark); }

/* ============================================================
   模块2: 选题每日灵感
   ============================================================ */
.inspire-grid{ display:flex; flex-direction:column; gap:10px; }
.inspire-item{
  padding:14px; background:#FFF; border-radius:var(--radius-sm);
  border:1px solid var(--border);
}
.inspire-item .inspire-tags{
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;
}
.inspire-item .tag{
  font-size:11px; padding:2px 8px; border-radius:10px;
  font-weight:500;
}
.tag-trend{ background:#FEF3C7; color:#B45309; }
.tag-douyin{ background:#FDE8E8; color:#C53030; }
.tag-xhs{ background:#FCE7F3; color:#9D174D; }
.tag-wechat{ background:#DBEAFE; color:#1E40AF; }

.inspire-item .inspire-title{
  font-size:14px; font-weight:600; line-height:1.4; margin-bottom:4px;
}
.inspire-item .inspire-desc{
  font-size:12px; color:var(--text2); line-height:1.5; margin-bottom:8px;
}
.inspire-item .inspire-actions{ display:flex; gap:6px; }
.inspire-item .jump-btn{
  font-size:11px; padding:5px 10px; border-radius:14px;
  border:1px solid var(--border); background:#FFF;
  cursor:pointer; font-weight:500;
  display:flex; align-items:center; gap:3px;
}
.jump-btn.dy{ color:#FF004F; border-color:#FF004F33; }
.jump-btn.dy:active{ background:#FF004F0F; }
.jump-btn.xhs{ color:#FF2442; border-color:#FF244233; }
.jump-btn.xhs:active{ background:#FF24420F; }
.jump-btn.source{
  color:var(--olive); border-color:var(--olive-light);
  font-size:11px; padding:5px 10px; border-radius:14px;
  border:1px solid var(--olive-light); background:var(--olive-light);
  cursor:pointer; font-weight:500; margin-top:6px; width:100%;
  display:flex; align-items:center; justify-content:center; gap:4px;
}
.jump-btn.source:active{ background:#D4E0CF; }

.gist-status{
  font-size:11px; color:var(--text3); text-align:center;
  padding:8px 0 2px;
}
.gist-status.success{ color:var(--olive); }
.gist-status.error{ color:var(--danger); }

/* ============================================================
   模块3: 爆款热点视频二创
   ============================================================ */
.remix-grid{ display:flex; flex-direction:column; gap:10px; }
.remix-item{
  padding:14px; background:#FFF; border-radius:var(--radius-sm);
  border:1px solid var(--border);
}
.remix-item .remix-header{
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
}
.remix-item .hot-badge{
  font-size:10px; background:var(--danger); color:#FFF;
  padding:2px 8px; border-radius:8px; font-weight:600;
}
.remix-item .remix-title{
  font-size:14px; font-weight:600; line-height:1.4; margin-bottom:4px;
}
.remix-item .remix-angle{
  font-size:12px; color:var(--olive); font-weight:500;
  background:var(--olive-light); padding:6px 10px; border-radius:8px;
  margin-top:6px; line-height:1.4;
}

/* 数据状态条（选题灵感 & 二创共用） */
.data-meta{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px; padding:8px 12px;
  background:var(--olive-light); border-radius:var(--radius-sm);
  font-size:11px; color:var(--text2);
}
.data-meta .meta-time{ display:flex; align-items:center; gap:4px; }
.data-meta .meta-time b{ color:var(--olive); font-weight:600; }
.data-meta .refresh-inline{
  border:1px solid var(--olive); background:#FFF;
  color:var(--olive); font-size:11px; font-weight:600;
  padding:4px 12px; border-radius:14px; cursor:pointer;
  display:flex; align-items:center; gap:3px;
}
.data-meta .refresh-inline:active{ background:var(--olive); color:#FFF; }
.data-meta .refresh-inline.loading{ opacity:.5; pointer-events:none; }
.data-loading{
  text-align:center; padding:30px 20px; color:var(--text3); font-size:13px;
}
.data-loading .spin-icon{
  display:inline-block; font-size:20px; margin-bottom:6px;
  animation:spin .8s linear infinite;
}

/* ============================================================
   模块4: 内容复盘
   ============================================================ */
.review-stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;
}
.stat-box{
  background:#FFF; border-radius:var(--radius-sm);
  padding:12px 8px; text-align:center; border:1px solid var(--border);
}
.stat-box .stat-num{ font-size:20px; font-weight:700; color:var(--olive); }
.stat-box .stat-label{ font-size:11px; color:var(--text3); margin-top:2px; }

.review-section{ margin-bottom:12px; }
.review-section label{
  font-size:13px; font-weight:600; color:var(--text); display:block; margin-bottom:4px;
}
.review-section textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:13px; font-family:var(--font);
  resize:vertical; min-height:60px; outline:none; line-height:1.5;
}
.review-section textarea:focus{ border-color:var(--olive); }

/* ============================================================
   模块5: 备忘录
   ============================================================ */
.memo-list{ display:flex; flex-direction:column; gap:2px; }
.memo-row{
  display:flex; align-items:center; gap:10px;
  padding:10px 4px; border-bottom:1px solid #f5f5f5;
}
.memo-row:last-child{ border-bottom:none; }
.memo-check{
  appearance:none; -webkit-appearance:none;
  width:20px; height:20px; min-width:20px;
  border:2px solid var(--border); border-radius:var(--radius-xs);
  cursor:pointer; position:relative;
}
.memo-check:checked{ background:var(--olive); border-color:var(--olive); }
.memo-check:checked::after{
  content:"✓"; color:#FFF; font-size:10px; font-weight:700;
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
}
.memo-row.done .memo-text{ text-decoration:line-through; color:var(--text3); }
.memo-text{
  flex:1; font-size:14px; border:none; outline:none; background:transparent;
  font-family:var(--font);
}
.memo-text:focus{ border-bottom:1px dashed var(--olive); }
.memo-del{
  border:none; background:transparent; color:var(--text3);
  font-size:18px; cursor:pointer; padding:2px 4px;
}
.memo-del:active{ color:var(--danger); }

.memo-add-btn{
  display:block; width:100%; padding:10px; margin-top:6px;
  border:1px dashed var(--border); border-radius:var(--radius-sm);
  background:transparent; font-size:13px; color:var(--text3); cursor:pointer;
}
.memo-add-btn:active{ background:var(--olive-light); }

/* ============================================================
   模块6: 日常记账
   ============================================================ */
.finance-form{
  display:flex; flex-direction:column; gap:8px; margin-bottom:14px;
  padding-bottom:14px; border-bottom:1px solid var(--border);
}
.finance-type-toggle{
  display:flex; gap:6px;
}
.finance-type-toggle .type-btn{
  flex:1; padding:10px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:#FFF; font-size:14px;
  cursor:pointer; font-weight:600; text-align:center;
  transition:all .15s;
}
.finance-type-toggle .type-btn.income.active{
  background:#E8F5E9; border-color:var(--olive); color:var(--olive);
}
.finance-type-toggle .type-btn.expense.active{
  background:#FDEDED; border-color:var(--danger); color:var(--danger);
}
.finance-row{
  display:flex; gap:6px;
}
.finance-row input,.finance-row select{
  padding:10px 12px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:14px; font-family:var(--font);
  outline:none; background:#FFF;
}
.finance-row input:focus,.finance-row select:focus{ border-color:var(--olive); }
.finance-row .fin-amount{ width:100px; flex-shrink:0; }
.finance-row .fin-cat{ flex:1; min-width:0; }
.finance-row .fin-cat-input{ flex:1; min-width:0; }
.finance-row .fin-note{ flex:2; min-width:0; }
.finance-form .btn-primary{
  padding:10px 20px; background:var(--olive); color:#FFF;
  border:none; border-radius:var(--radius-sm); font-size:14px;
  font-weight:600; cursor:pointer;
}
.finance-form .btn-primary:active{ background:var(--olive-dark); }

/* 记账汇总 */
.finance-summary{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  margin-bottom:14px; padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.finance-summary .sum-item{
  background:#FFF; border-radius:var(--radius-sm); padding:12px 8px;
  text-align:center; border:1px solid var(--border);
}
.finance-summary .sum-num{
  font-size:18px; font-weight:700; display:block;
}
.finance-summary .sum-num.income{ color:var(--olive); }
.finance-summary .sum-num.expense{ color:var(--danger); }
.finance-summary .sum-num.balance{ color:var(--blue); }
.finance-summary .sum-label{
  font-size:11px; color:var(--text3); display:block; margin-top:2px;
}

/* 支出分类占比 */
.finance-categories{ margin-bottom:14px; }
.finance-categories .cat-title{
  font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px;
}
.finance-categories .cat-row{
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
  font-size:12px;
}
.finance-categories .cat-name{
  width:52px; text-align:right; color:var(--text2); flex-shrink:0;
}
.finance-categories .cat-bar{
  flex:1; height:14px; background:var(--olive-light); border-radius:7px;
  overflow:hidden;
}
.finance-categories .cat-bar-fill{
  height:100%; background:var(--olive); border-radius:7px;
  transition:width .3s; min-width:2px;
}
.finance-categories .cat-amount{
  width:60px; text-align:right; color:var(--text2); flex-shrink:0;
  font-weight:600;
}
.finance-categories .cat-pct{
  width:36px; text-align:right; color:var(--text3); flex-shrink:0;
}
/* 月度/年度切换 */
.finance-period{
  display:flex; gap:4px; margin-bottom:10px;
}
.finance-period .period-btn{
  padding:5px 14px; border:1px solid var(--border); border-radius:14px;
  font-size:12px; cursor:pointer; background:#FFF; color:var(--text2);
  font-weight:500;
}
.finance-period .period-btn.active{
  background:var(--olive); color:#FFF; border-color:var(--olive);
}

/* 记账列表 */
.finance-records{ max-height:300px; overflow-y:auto; }
.finance-records .rec-date-group{ margin-bottom:8px; }
.finance-records .rec-date-label{
  font-size:12px; color:var(--text3); font-weight:600;
  padding:6px 4px 4px; border-bottom:1px solid #f5f5f5; margin-bottom:4px;
}
.finance-records .rec-item{
  display:flex; align-items:center; gap:8px;
  padding:8px 4px; font-size:13px; border-bottom:1px solid #fafafa;
}
.finance-records .rec-item .rec-tag{

/* 录音功能 */

/* 录音波形模拟条 */

}

.expr-audio-bars .bar:nth-child(2){ height:16px; animation-delay:.1s; }

<body>

<div class="app" id="app">

  <!-- 顶部栏 -->
  <header class="header">
    <button class="menu-btn" id="menuBtn">☰</button>
    <span class="title">创作工作台</span>
    <button class="sync-btn" id="syncBtn" title="刷新数据">🔄</button>
  </header>

  <!-- 抽屉遮罩 -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- 抽屉 -->
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="brand">✏️ 创作工作台</div>
      <div class="brand-sub">内容创作者每日助手</div>
    </div>
    <div class="drawer-nav" id="drawerNav"></div>
    <div class="drawer-footer">
      <div style="margin-bottom:8px;">
        <label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px;">🔗 GitHub Gist ID</label>
        <input type="text" id="gistIdInput" placeholder="填入Gist ID后可拉取数据"
          style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;outline:none;"/>
      </div>
      <button class="manage-btn" id="manageModulesBtn">⚙️ 管理模块</button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="mainContent"></main>

  <!-- 模块管理弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>⚙️ 模块管理</h3>
      <div class="mod-list" id="modList"></div>
      <div class="mod-add">
        <input type="text" id="newModInput" placeholder="输入新模块名称…"/>
        <button class="btn" id="addModBtn">+ 添加</button>
      </div>
      <button class="btn-close" id="closeModal">关闭</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script>
/* ============================================================
   数据层 — 所有模块定义与持久化
   ============================================================ */
const DEFAULT_MODULES = [
  { id:'daily-plan',   icon:'📋', name:'每日计划',   builtin:true },
  { id:'inspiration',  icon:'💡', name:'选题每日灵感', builtin:true },
  { id:'hot-remix',    icon:'🔥', name:'爆款热点视频二创', builtin:true },
  { id:'review',       icon:'📊', name:'内容复盘',   builtin:true },
  { id:'memo',         icon:'📝', name:'备忘录',     builtin:true },
  { id:'finance',      icon:'💰', name:'日常记账',   builtin:true },
  { id:'exercise',     icon:'🏃', name:'每日运动记录', builtin:true },
  { id:'expression',  icon:'🎤', name:'表达能力训练', builtin:true },
];

// ---------- localStorage keys ----------
const LS_MODULES = 'cw_modules_v2';
const LS_TASKS  = 'cw_tasks_v2';
const LS_MEMOS  = 'cw_memos_v2';
const LS_REVIEW = 'cw_review_v2';
const LS_INSPIRE= 'cw_inspire_v2';
const LS_REMIX  = 'cw_remix_v2';
const LS_FINANCE= 'cw_finance_v2';
const LS_EXERCISE='cw_exercise_v2';
const LS_EXPRESSION='cw_expression_v2';
const LS_EXPR_STREAK='cw_expr_streak_v2';

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(_) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// ---------- 模块 ----------
let modules = load(LS_MODULES, null) || JSON.parse(JSON.stringify(DEFAULT_MODULES));
let activeModuleId = modules.length ? modules[0].id : '';

// ---------- 日期工具 ----------
function dateStr(d) { const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr() { return dateStr(new Date()); }

// ---------- 每日计划任务（含日期） ----------
let tasks = load(LS_TASKS, null) || [
  { id:1, text:'健身 0.5 小时', done:false, date: todayStr() },
  { id:2, text:'平板支撑 3 分钟', done:false, date: todayStr() },
  { id:3, text:'排浊操 5 分钟', done:false, date: todayStr() },
];
// 迁移旧数据：无date字段的任务补充为今天
tasks.forEach(t => { if(!t.date) t.date = todayStr(); });

// ---------- 日历状态 ----------
let calYear, calMonth, calSelectedDate;
(function initCal() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth(); // 0-based
  calSelectedDate = todayStr();
})();

// ---------- 备忘录 ----------
let memos = load(LS_MEMOS, null) || [
  { id:1, text:'', done:false },
  { id:2, text:'', done:false },
  { id:3, text:'', done:false },
  { id:4, text:'', done:false },
  { id:5, text:'', done:false },
];

// ---------- 内容复盘 ----------
let review = load(LS_REVIEW, null) || {
  plays:0, likes:0, comments:0, shares:0,
  highlight:'', problem:'', improve:''
};

// ---------- 选题灵感 (Gist 数据) ----------
let inspireData = load(LS_INSPIRE, null) || [];
let remixData   = load(LS_REMIX, null)   || [];

// ---------- 日常记账 ----------
let financeRecords = load(LS_FINANCE, null) || [];
let financeIdCounter = financeRecords.length ? Math.max(...financeRecords.map(r=>r.id)) : 0;

// ---------- 每日运动记录 ----------
let exerciseRecords = load(LS_EXERCISE, null) || [];
let exerciseIdCounter = exerciseRecords.length ? Math.max(...exerciseRecords.map(r=>r.id)) : 0;

// ---------- 表达能力训练 ----------
let expressionRecords = load(LS_EXPRESSION, null) || [];
let exprIdCounter = expressionRecords.length ? Math.max(...expressionRecords.map(r=>r.id)) : 0;
let exprStreak = load(LS_EXPR_STREAK, null) || { count:0, lastDate:'' };

// ---------- Gist 配置 (用户填写后生效) ----------
let GIST_ID = localStorage.getItem('cw_gist_id') || 'e9b80c535dc2e91a5078e398a066554b';

// ---------- 数据更新时间戳 ----------
let dataUpdatedAt = localStorage.getItem('cw_data_updated_at') || '';
let dataFetching = false;

/* ============================================================
   渲染引擎
   ============================================================ */
const $ = (s) => document.querySelector(s);
const $$= (s) => document.querySelectorAll(s);

// 抽屉
function renderDrawer() {
  const nav = $('#drawerNav');
  nav.innerHTML = modules.map(m => `
    <div class="drawer-item${m.id===activeModuleId?' active':''}" data-mid="${m.id}">
      <span class="icon">${m.icon}</span><span>${m.name}</span>
    </div>
  `).join('');
  // 点击切换
  nav.querySelectorAll('.drawer-item').forEach(el => {
    el.addEventListener('click', () => {
      activeModuleId = el.dataset.mid;
      renderAll();
      closeDrawer();
    });
  });
}

function closeDrawer() {
  $('#drawer').classList.remove('open');
  $('#drawerOverlay').classList.remove('open');
}
function openDrawer() {
  $('#drawer').classList.add('open');
  $('#drawerOverlay').classList.add('open');
}

// ---------- 日历辅助函数 ----------
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDayOfMonth(y,m){ return new Date(y,m,1).getDay(); } // 0=Sun

function tasksOnDate(date){ return tasks.filter(t=>t.date===date); }
function datesWithTasks(){
  const s = new Set();
  tasks.forEach(t=>{ if(t.date) s.add(t.date); });
  return s;
}

// ---------- 模块1: 每日计划（日历视图） ----------
function renderDailyPlan() {
  const today = todayStr();
  const activeDates = datesWithTasks();
  const days = daysInMonth(calYear, calMonth);
  const firstDay = firstDayOfMonth(calYear, calMonth);
  const prevMonthDays = daysInMonth(calYear, calMonth-1<0?11:calMonth-1);
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // 构建日历格子
  let cells = '';
  // 上月填充
  for(let i=firstDay-1; i>=0; i--) {
    const d = prevMonthDays - i;
    const ds = `${calMonth===0?calYear-1:calYear}-${String(calMonth===0?12:calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells += `<div class="calendar-day other-month" data-date="${ds}">${d}</div>`;
  }
  // 当月日期
  for(let d=1; d<=days; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'calendar-day';
    if(ds === today) cls += ' today';
    if(ds === calSelectedDate) cls += ' selected';
    const dot = activeDates.has(ds) ? '<span class="dot"></span>' : '';
    cells += `<div class="${cls}" data-date="${ds}">${d}${dot}</div>`;
  }
  // 下月填充（填满6行）
  const totalCells = firstDay + days;
  const remaining = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
  for(let d=1; d<=remaining; d++) {
    const ds = `${calMonth===11?calYear+1:calYear}-${String(calMonth===11?0:calMonth+1+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells += `<div class="calendar-day other-month" data-date="${ds}">${d}</div>`;
  }

  // 选中日期的任务
  const selTasks = tasksOnDate(calSelectedDate);
  const doneCount = selTasks.filter(t=>t.done).length;
  const total = selTasks.length;
  const pct = total ? Math.round(doneCount/total*100) : 0;

  // 选中日期格式化展示
  const [sy,sm,sd] = calSelectedDate.split('-');
  const dateDisplay = `${parseInt(sm)}月${parseInt(sd)}日`;

  // 今日提醒
  let reminder = '';
  if(calSelectedDate === today && total > 0) {
    const undone = selTasks.filter(t=>!t.done).length;
    if(undone > 0) {
      reminder = `<div class="calendar-reminder">🔔 今日还有 <b>${undone}</b> 项任务待完成</div>`;
    } else {
      reminder = `<div class="calendar-reminder" style="background:#E8F5E9;color:#2E7D32;">🎉 今日任务全部完成！</div>`;
    }
  } else if(calSelectedDate > today && total > 0) {
    reminder = `<div class="calendar-reminder">📅 未来日程 · 已安排 <b>${total}</b> 项任务</div>`;
  } else if(calSelectedDate < today) {
    const undonePast = selTasks.filter(t=>!t.done).length;
    if(undonePast > 0) {
      reminder = `<div class="calendar-reminder" style="background:#FDEDED;color:#C53030;">⚠️ 过往日期还有 <b>${undonePast}</b> 项未完成</div>`;
    }
  }

  return `
    <div class="calendar-nav">
      <button class="nav-btn" id="calPrev">◀</button>
      <span class="month-label">${calYear}年 ${monthNames[calMonth]}</span>
      <button class="nav-btn" id="calNext">▶</button>
      <button class="today-btn" id="calToday">今天</button>
    </div>
    <div class="calendar-weekdays">
      <span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span>
    </div>
    <div class="calendar-grid">${cells}</div>
    <div class="calendar-date-info">
      <span class="date-label">${dateDisplay} 任务${calSelectedDate===today ? '<span class="today-badge">今天</span>' : ''}</span>
    </div>
    ${reminder}
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text"><span>该日进度</span><span><b>${doneCount}/${total}</b> (${pct}%)</span></div>
    </div>
    <div class="task-list">${selTasks.map(t=>`
      <div class="task-row${t.done?' done':''}" data-tid="${t.id}">
        <input type="checkbox" class="task-check"${t.done?' checked':''}/>
        <span class="task-text">${escHtml(t.text)}</span>
        <button class="task-del" title="删除">×</button>
      </div>
    `).join('')}
    ${selTasks.length===0 ? '<div class="empty-state" style="padding:16px;font-size:12px;">暂无任务，点击下方添加</div>' : ''}
    </div>
    <div class="task-add">
      <input type="text" id="newTaskInput" placeholder="添加任务…"/>
      <button class="btn" id="addTaskBtn">+ 添加</button>
    </div>
  `;
}

function bindDailyPlan(el) {
  // 上月
  const prevBtn = el.querySelector('#calPrev');
  if(prevBtn) prevBtn.addEventListener('click',()=>{
    calMonth--; if(calMonth<0){ calMonth=11; calYear--; }
    calSelectedDate = `${calYear}-${String(calMonth+1).padStart(2,'0')}-01`;
    renderModule('daily-plan');
  });
  // 下月
  const nextBtn = el.querySelector('#calNext');
  if(nextBtn) nextBtn.addEventListener('click',()=>{
    calMonth++; if(calMonth>11){ calMonth=0; calYear++; }
    calSelectedDate = `${calYear}-${String(calMonth+1).padStart(2,'0')}-01`;
    renderModule('daily-plan');
  });
  // 今天
  const todayBtn = el.querySelector('#calToday');
  if(todayBtn) todayBtn.addEventListener('click',()=>{
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    calSelectedDate = todayStr();
    renderModule('daily-plan');
  });
  // 日期点击
  el.querySelectorAll('.calendar-day').forEach(day => {
    day.addEventListener('click', function(){
      calSelectedDate = this.dataset.date;
      // 如果点击的是其他月份的日期，切换月份
      const [y,m] = calSelectedDate.split('-');
      calYear = parseInt(y);
      calMonth = parseInt(m)-1;
      renderModule('daily-plan');
    });
  });
  // 勾选
  el.querySelectorAll('.task-check').forEach(cb => {
    cb.addEventListener('change', function() {
      const tid = +this.closest('.task-row').dataset.tid;
      const t = tasks.find(x=>x.id===tid);
      if(t){ t.done = this.checked; save(LS_TASKS,tasks); renderModule('daily-plan'); }
    });
  });
  // 删除
  el.querySelectorAll('.task-del').forEach(btn => {
    btn.addEventListener('click', function() {
      const tid = +this.closest('.task-row').dataset.tid;
      tasks = tasks.filter(x=>x.id!==tid);
      save(LS_TASKS,tasks);
      renderModule('daily-plan');
    });
  });
  // 添加任务
  const addBtn = el.querySelector('#addTaskBtn');
  const addInp = el.querySelector('#newTaskInput');
  if(addBtn && addInp) {
    const doAdd = () => {
      const text = addInp.value.trim();
      if(!text) return;
      const id = tasks.length ? Math.max(...tasks.map(x=>x.id))+1 : 1;
      tasks.push({ id, text, done:false, date: calSelectedDate });
      save(LS_TASKS,tasks);
      addInp.value = '';
      renderModule('daily-plan');
    };
    addBtn.addEventListener('click', doAdd);
    addInp.addEventListener('keydown', e => { if(e.key==='Enter') doAdd(); });
  }
}

const FINANCE_CAT_ICONS = {
  '餐饮':'🍽️','交通':'🚌','购物':'🛍️','娱乐':'🎮','居住':'🏠','医疗':'💊','学习':'📚','其他':'📦',
  '薪资':'💰','副业':'💼','理财':'📈','红包':'🧧','报销':'📋','通讯':'📱','美妆':'💄','服饰':'👔'
};
const DEFAULT_EXPENSE_CATS = ['餐饮','交通','购物','娱乐','居住','医疗','学习','其他'];
const DEFAULT_INCOME_CATS  = ['薪资','副业','理财','红包','报销','其他'];
const FINANCE_COLORS = ['#4A7C3F','#F0833A','#3B82F6','#8B5CF6','#E94560','#F9A825','#00ACC1','#66BB6A','#AB47BC','#FF7043'];
const LS_FIN_BUDGET = 'cw_fin_budget_v2';
const LS_FIN_CATS   = 'cw_fin_cats_v2';

let financeBudget = load(LS_FIN_BUDGET, 0) || 0;
let financeCats = load(LS_FIN_CATS, null) || { expense: [...DEFAULT_EXPENSE_CATS], income: [...DEFAULT_INCOME_CATS] };
window._finTab = window._finTab || 'home';
window._finBillFilter = window._finBillFilter || 'all';
window._finBillYear = window._finBillYear || new Date().getFullYear();
window._finBillMonth = window._finBillMonth !== undefined ? window._finBillMonth : new Date().getMonth();
window._finStatsPeriod = window._finStatsPeriod || 'month';

function finCatIcon(cat){ return FINANCE_CAT_ICONS[cat] || '📦'; }

function getFinRecords(period){
  const now = new Date();
  if(period==='month'){
    return financeRecords.filter(r=>{ const d=new Date(r.date); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); });
  } else if(period==='week'){
    const now2=new Date(now); now2.setDate(now2.getDate()-6);
    return financeRecords.filter(r=>{ const d=new Date(r.date); return d>=now2; });
  } else {
    return financeRecords.filter(r=>{ const d=new Date(r.date); return d.getFullYear()===now.getFullYear(); });
  }
}

function renderFinance() {
  const tab = window._finTab || 'home';
  let pageHTML = '';
  if(tab==='home') pageHTML = renderFinHome();
  else if(tab==='bills') pageHTML = renderFinBills();
  else if(tab==='stats') pageHTML = renderFinStats();
  else if(tab==='settings') pageHTML = renderFinSettings();

  return `

        <button class="fin-nav-item ${tab==='stats'?'active':''}" data-fintab="stats"><span class="nav-icon">📊</span>统计</button>
        <button class="fin-nav-item ${tab==='settings'?'active':''}" data-fintab="settings"><span class="nav-icon">👤</span>我的</button>
      </nav>
    </div>
  `;
}

function renderFinHome(){
  const now=new Date();
  const monthRecs = financeRecords.filter(r=>{ const d=new Date(r.date); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); });
  const totalIncome = monthRecs.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0);
  const totalExpense = monthRecs.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);
  const balance = totalIncome - totalExpense;
  const budget = financeBudget || 0;
  const budgetUsed = totalExpense;
  const budgetRemain = budget - budgetUsed;
  const budgetPct = budget>0 ? Math.min(budgetUsed/budget*100,100) : 0;
  const budgetColor = budgetPct>=90 ? '#D94A4A' : budgetPct>=70 ? '#F0833A' : '#4A7C3F';

  const cats = financeCats.expense || DEFAULT_EXPENSE_CATS;
  const catGrid = cats.map(c=>`
    <div class="fin-cat-item" data-cat="${escHtml(c)}" data-type="expense">
      <span class="cat-icon">${finCatIcon(c)}</span>
      <span class="cat-name">${escHtml(c)}</span>
      ${!DEFAULT_EXPENSE_CATS.includes(c) ? '<button class="cat-del" data-delcat="'+escHtml(c)+'" data-deltype="expense">×</button>' : ''}
    </div>
  `).join('') + `<div class="fin-cat-add" data-addcat="expense"><span style="font-size:24px">＋</span><span>添加</span></div>`;

  return `
    <div class="fin-home">
      <div class="fin-balance-card">
        <div class="fin-balance-label">本月结余 (¥)</div>
        <div class="fin-balance-num">${balance>=0?'+':''}${balance.toFixed(2)}</div>
        <div class="fin-balance-row">
          <div><div class="lbl">本月收入</div><div class="num income-num">¥${totalIncome.toFixed(0)}</div></div>
          <div><div class="lbl">本月支出</div><div class="num expense-num">¥${totalExpense.toFixed(0)}</div></div>
        </div>
      </div>
      ${budget>0 ? `
      <div class="fin-budget-card">
        <div class="fin-budget-header">
          <span class="fin-budget-title">💳 月度预算</span>
          <span class="fin-budget-remain" style="color:${budgetColor}">剩余 ¥${budgetRemain>0?budgetRemain.toFixed(0):0}</span>
        </div>
        <div class="fin-budget-bar"><div class="fin-budget-bar-fill" style="width:${budgetPct}%;background:${budgetColor}"></div></div>
        <div class="fin-budget-info">
          <span>已花 ¥${budgetUsed.toFixed(0)}</span>
          <span>预算 ¥${budget.toFixed(0)}</span>
          <span>${Math.round(budgetPct)}%</span>
        </div>
      </div>` : ''}
      <div class="fin-quick-actions">
        <button class="fin-quick-btn expense" data-quick="expense">💸 记支出</button>
        <button class="fin-quick-btn income" data-quick="income">💰 记收入</button>
      </div>
      <div class="fin-section-title">收支分类</div>
      <div class="fin-cat-grid">${catGrid}</div>
    </div>
  `;
}

function renderFinBills(){
  const yr = window._finBillYear;
  const mo = window._finBillMonth;
  const filter = window._finBillFilter;
  let recs = financeRecords.filter(r=>{ const d=new Date(r.date); return d.getFullYear()===yr && d.getMonth()===mo; });
  if(filter!=='all') recs = recs.filter(r=>r.type===filter);
  recs.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const nowY=new Date().getFullYear();

  const listHTML = recs.length ? recs.map(r=>`

      <div class="bill-amount ${r.type}">${r.type==='income'?'+':'-'}¥${Number(r.amount).toFixed(2)}</div>

    <div class="fin-bills">

      </div>
      <div class="fin-bill-list">${listHTML}</div>

function renderFinStats(){
  const period = window._finStatsPeriod;
  const recs = getFinRecords(period);
  const expenseRecs = recs.filter(r=>r.type==='expense');

  // 饼图数据
  const catMap={};
  expenseRecs.forEach(r=>{ const c=r.category||'其他'; catMap[c]=(catMap[c]||0)+Number(r.amount); });
  const catEntries = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const totalExp = catEntries.reduce((s,[,v])=>s+v,0);

  // SVG饼图
  let pieSVG='';
  if(catEntries.length){
    let acc=0; const R=55, cx=65, cy=65;
    const arcs = catEntries.map(([cat,amt],i)=>{
      const pct = totalExp>0 ? amt/totalExp : 0;
      const startAngle = acc*2*Math.PI - Math.PI/2;
      acc += pct;
      const endAngle = acc*2*Math.PI - Math.PI/2;
      const x1=cx+R*Math.cos(startAngle), y1=cy+R*Math.sin(startAngle);
      const x2=cx+R*Math.cos(endAngle), y2=cy+R*Math.sin(endAngle);
      const largeArc = pct>0.5?1:0;
      const color = FINANCE_COLORS[i%FINANCE_COLORS.length];
      if(pct>=0.999) return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${color}"/>`;
      return `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${color}"/>`;
    }).join('');
    pieSVG = `<svg class="fin-pie-svg" viewBox="0 0 130 130"><circle cx="65" cy="65" r="55" fill="#F5F7F0"/>${arcs}<circle cx="65" cy="65" r="30" fill="#FFF"/><text x="65" y="62" text-anchor="middle" font-size="10" fill="#999">总支出</text><text x="65" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#333">¥${totalExp.toFixed(0)}</text></svg>`;
  } else {
    pieSVG = `<svg class="fin-pie-svg" viewBox="0 0 130 130"><circle cx="65" cy="65" r="55" fill="#F5F7F0"/><text x="65" y="70" text-anchor="middle" font-size="12" fill="#999">暂无数据</text></svg>`;
  }
  const legendHTML = catEntries.length ? catEntries.slice(0,8).map(([cat,amt],i)=>`
    <div class="leg-item">
      <span class="leg-dot" style="background:${FINANCE_COLORS[i%FINANCE_COLORS.length]}"></span>
      <span class="leg-name">${escHtml(cat)}</span>
      <span class="leg-val">¥${amt.toFixed(0)}</span>
    </div>
  `).join('') : '<div style="font-size:12px;color:#999;padding:10px 0">暂无支出数据</div>';

  // 柱状图 — 近7天
  const now=new Date();
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const ds=dateStr(d);
    const dayExp = expenseRecs.filter(r=>r.date===ds).reduce((s,r)=>s+Number(r.amount),0);
    days.push({ date:ds, exp:dayExp, label:(d.getMonth()+1)+'/'+d.getDate(), isToday:i===0 });
  }
  const maxDayExp = Math.max(...days.map(d=>d.exp),1);
  const barHTML = days.map(d=>`
    <div class="fin-bar-item">
      <span class="bar-val">${d.exp>0?'¥'+d.exp.toFixed(0):''}</span>
      <div class="bar-col ${d.isToday?'active':''}" style="height:${Math.max(d.exp/maxDayExp*90,4)}px"></div>
      <span class="bar-day">${d.label}</span>
    </div>
  `).join('');

  // 排行榜
  const rankHTML = catEntries.length ? catEntries.map(([cat,amt],i)=>`
    <div class="fin-rank-item">
      <span class="rank-num">${i+1}</span>
      <div class="rank-info">
        <div class="rank-name">${finCatIcon(cat)} ${escHtml(cat)}</div>
        <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${catEntries[0][1]>0?amt/catEntries[0][1]*100:0}%"></div></div>
      </div>
      <span class="rank-amount">¥${amt.toFixed(0)}</span>
    </div>
  `).join('') : '<div class="expr-empty">暂无排行数据</div>';

  const periodLabel = period==='month'?'本月':period==='week'?'本周':'本年';

  return `
    <div class="fin-stats">
      <div class="fin-stats-tabs">
        <button class="st-tab ${period==='month'?'active':''}" data-period="month">本月</button>
        <button class="st-tab ${period==='week'?'active':''}" data-period="week">本周</button>
        <button class="st-tab ${period==='year'?'active':''}" data-period="year">本年</button>
      </div>
      <div class="fin-chart-card">
        <div class="chart-title">🥧 ${periodLabel}支出分类</div>
        <div class="fin-pie-wrap">${pieSVG}<div class="fin-pie-legend">${legendHTML}</div></div>
      </div>
      <div class="fin-chart-card">
        <div class="chart-title">📈 近7天支出趋势</div>
        <div class="fin-bar-wrap">${barHTML}</div>
      </div>

function finOpenModal(type, presetCat){

  const catPicker = cats.map(c=>`<div class="picker-item ${c===presetCat?'active':''}" data-pickcat="${escHtml(c)}"><span class="pi-icon">${finCatIcon(c)}</span><span>${escHtml(c)}</span></div>`).join('');
  const overlay = document.createElement('div');
  overlay.className='fin-modal-overlay';
  overlay.innerHTML=`
    <div class="fin-modal">
      <h4>${type==='income'?'💰 记收入':'💸 记支出'}<button class="fin-modal-close">×</button></h4>
      <div class="fin-form-row">

        <label>日期</label>
        <input type="date" id="finModalDate" value="${todayStr()}"/>
      </div>
      <div class="fin-form-row">
        <label>备注（可选）</label>

      </div>

    </div>

  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('open'),10);
  let selectedCat = presetCat || cats[0];

  overlay.querySelector('.fin-modal-close').addEventListener('click',()=>finCloseModal(overlay));
  overlay.addEventListener('click',e=>{ if(e.target===overlay) finCloseModal(overlay); });

  overlay.querySelectorAll('.picker-item').forEach(pi=>{
    pi.addEventListener('click',()=>{
      overlay.querySelectorAll('.picker-item').forEach(x=>x.classList.remove('active'));
      pi.classList.add('active');
      selectedCat = pi.dataset.pickcat;
    });
  });

  overlay.querySelector('#finModalSave').addEventListener('click',()=>{
    const amount = parseFloat(overlay.querySelector('#finModalAmount').value);
    if(isNaN(amount)||amount<=0){ showToast('请输入有效金额'); return; }
    const date = overlay.querySelector('#finModalDate').value || todayStr();
    const note = overlay.querySelector('#finModalNote').value.trim();
    financeIdCounter++;
    financeRecords.push({ id:financeIdCounter, type, amount, category:selectedCat, note, date });
    save(LS_FINANCE, financeRecords);
    finCloseModal(overlay);
    renderModule('finance');
    showToast('✅ 已记录'+(type==='income'?'收入':'支出')+' ¥'+amount.toFixed(2));
  });
}

function finExportData(fmt){
  if(!financeRecords.length){ showToast('暂无数据可导出'); return; }
  let content, filename, mime;
  if(fmt==='json'){
    content=JSON.stringify(financeRecords,null,2);
    filename='finance_records.json'; mime='application/json';
  } else {
    const header='日期,类型,分类,金额,备注\n';
    const rows=financeRecords.map(r=>`${r.date},${r.type==='income'?'收入':'支出'},${r.category||''},${r.amount},${r.note||''}`).join('\n');
    content='\ufeff'+header+rows;
    filename='finance_records.csv'; mime='text/csv;charset=utf-8';
  }
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 已导出 '+filename);
}

function finBackup(){
  const data={ records:financeRecords, budget:financeBudget, cats:financeCats };
  const content=JSON.stringify(data,null,2);
  const blob=new Blob([content],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='finance_backup_'+todayStr()+'.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 备份文件已下载');
}

function bindFinance(el) {
  // 底部导航切换
  el.querySelectorAll('.fin-nav-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._finTab = btn.dataset.fintab;
      renderModule('finance');
    });
  });

  // 首页 — 快捷按钮
  el.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.addEventListener('click',()=> finOpenModal(btn.dataset.quick));
  });

  // 首页 — 分类点击快速记账
  el.querySelectorAll('.fin-cat-item').forEach(item=>{
    item.addEventListener('click',e=>{
      if(e.target.classList.contains('cat-del')) return;
      finOpenModal(item.dataset.type, item.dataset.cat);
    });
  });
  // 首页 — 删除自定义分类
  el.querySelectorAll('.cat-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const cat=btn.dataset.delcat, type=btn.dataset.deltype;
      financeCats[type]=financeCats[type].filter(c=>c!==cat);
      save(LS_FIN_CATS, financeCats);
      renderModule('finance');
      showToast('已删除分类');
    });
  });
  // 首页 — 添加分类
  el.querySelectorAll('[data-addcat]').forEach(btn=>{
    btn.addEventListener('click',()=> finOpenCatMgmtModal());
  });

  // 账单页 — 筛选
  el.querySelectorAll('[data-filter]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._finBillFilter=btn.dataset.filter;
      renderModule('finance');
    });
  });
  // 账单页 — 年月切换
  el.querySelector('#finBillYear')?.addEventListener('change',e=>{ window._finBillYear=parseInt(e.target.value); renderModule('finance'); });
  el.querySelector('#finBillMonth')?.addEventListener('change',e=>{ window._finBillMonth=parseInt(e.target.value); renderModule('finance'); });
  // 账单页 — 删除
  el.querySelectorAll('.bill-del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const fid=+btn.closest('.fin-bill-item').dataset.fid;
      financeRecords=financeRecords.filter(r=>r.id!==fid);
      save(LS_FINANCE, financeRecords);
      renderModule('finance');
      showToast('已删除');
    });
  });

  // 统计页 — 周期切换
  el.querySelectorAll('[data-period]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._finStatsPeriod=btn.dataset.period;
      renderModule('finance');
    });
  });

  // 我的页面 — 设置项
  el.querySelectorAll('[data-set]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const action=btn.dataset.set;
      if(action==='budget') finOpenBudgetModal();
      else if(action==='catmgmt') finOpenCatMgmtModal();
      else if(action==='export') finExportData('csv');
      else if(action==='backup') finBackup();
      else if(action==='clear'){
        if(confirm('⚠️ 确定清除所有记账数据？此操作不可恢复！')){
          financeRecords=[]; financeIdCounter=0; financeBudget=0;
          financeCats={expense:[...DEFAULT_EXPENSE_CATS],income:[...DEFAULT_INCOME_CATS]};
          save(LS_FINANCE,financeRecords); save(LS_FIN_BUDGET,0); save(LS_FIN_CATS,financeCats);
          renderModule('finance');
          showToast('已清除所有数据');
        }
      }
    });
  });
}

function renderExercise() {
  // 按日期分组最近的记录
  const recent = [...exerciseRecords].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,60);
  const groups = {};
  recent.forEach(r=>{
    if(!groups[r.date]) groups[r.date]=[];
    groups[r.date].push(r);
  });

  const typeIcon = (t) => {
    const found = EXERCISE_TYPES.find(e=>e.val===t);
    return found ? found.icon : '🏅';
  };

  const recordsHTML = Object.keys(groups).sort().reverse().map(date => {
    const dayTotal = groups[date].reduce((s,r)=>s+(Number(r.duration)||0),0);
    return `
    <div class="ex-date-group">
      <div class="ex-date-label">📅 ${date}<span class="ex-date-total">共 ${dayTotal} 分钟</span></div>
      ${groups[date].map(r=>`
        <div class="ex-item" data-eid="${r.id}">
          <span class="ex-icon">${typeIcon(r.type)}</span>
          <div class="ex-info">
            <div class="ex-type-name">${escHtml(r.type||'运动')}</div>
            <div class="ex-meta"><span>⏱ ${r.duration||0}分钟</span></div>
            ${r.feeling ? `<div class="ex-feeling">💬 ${escHtml(r.feeling)}</div>` : ''}
          </div>
          <span class="ex-duration-badge">${r.duration||0}分钟</span>
          <button class="ex-del" title="删除">×</button>
        </div>
      `).join('')}
    </div>
  `}).join('');

  return `
    <div class="exercise-form">
      <div class="ex-row">
        <select class="ex-type" id="exType">${EXERCISE_TYPES.map(e=>`<option value="${e.val}">${e.icon} ${e.val}</option>`).join('')}</select>
        <input type="number" class="ex-duration" id="exDuration" placeholder="分钟" min="1" inputmode="numeric"/>
      </div>
      <textarea id="exFeeling" placeholder="运动感受（可选）…"></textarea>
      <button class="btn-primary" id="addExerciseBtn">💪 记录运动</button>
    </div>
    <div class="exercise-records">${recordsHTML || '<div class="empty-state" style="padding:20px;">🏃 还没有运动记录，开始记录吧！</div>'}</div>
  `;
}

function bindExercise(el) {
  el.querySelector('#addExerciseBtn')?.addEventListener('click', ()=>{
    const type = el.querySelector('#exType')?.value || '其他';
    const duration = parseInt(el.querySelector('#exDuration')?.value) || 0;
    if(duration <= 0) { showToast('请填写运动时长'); return; }
    const feeling = el.querySelector('#exFeeling')?.value?.trim() || '';
    exerciseIdCounter++;
    exerciseRecords.push({
      id: exerciseIdCounter,
      type: type,
      duration: duration,
      feeling: feeling,
      date: todayStr()
    });
    save(LS_EXERCISE, exerciseRecords);
    el.querySelector('#exDuration').value = '';
    el.querySelector('#exFeeling').value = '';
    renderModule('exercise');
    showToast('✅ 运动已记录');
  });

  el.querySelectorAll('.ex-del').forEach(btn=>{
    btn.addEventListener('click', function(){
      const eid = +this.closest('.ex-item').dataset.eid;
      exerciseRecords = exerciseRecords.filter(r=>r.id!==eid);
      save(LS_EXERCISE, exerciseRecords);
      renderModule('exercise');
    });
  });
}

function exprUpdateStreak(){
  const today=todayStr();
  if(exprStreak.lastDate===today) return;
  const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yd=dateStr(yesterday);
  if(exprStreak.lastDate===yd || exprStreak.lastDate===''){
    exprStreak.count = exprStreak.lastDate==='' ? 1 : exprStreak.count+1;
  } else {
    exprStreak.count=1;
  }
  exprStreak.lastDate=today;
  save(LS_EXPR_STREAK, exprStreak);
}

function exprGetQuestion(type){
  const diff=window._exprDifficulty;
  const pool=EXPR_QUESTIONS[type][diff]||EXPR_QUESTIONS[type].easy;
  const idx=Math.floor(Math.random()*pool.length);
  return pool[idx];
}

function exprAIReview(type, difficulty, question, answer){
  if(!answer||answer.trim().length<10){
    return { score:'需展开', tips:[
      '⚠️ 回答篇幅过短，建议至少展开100字以上。',
      '表达训练的核心是"说清楚"，尝试多展开一些细节。',
      '可以先列提纲，再逐点展开。'
    ]};
  }
  const len=answer.length;
  const tips=[];
  let scoreNum=60;

  // 结构化检测
  const structWords=['首先','其次','最后','第一','第二','第三','一方面','另一方面','总之','综上','因此'];
  const hasStruct = structWords.some(w=>answer.includes(w));
  if(hasStruct){ scoreNum+=15; tips.push('✅ 使用了结构化表达词（首先/其次等），逻辑层次清晰。'); }
  else tips.push('💡 建议使用"首先、其次、最后"等结构词，让表达更有层次。');

  // 篇幅评分
  if(len>200) scoreNum+=15;
  else if(len>100) scoreNum+=10;
  else tips.push('💡 回答可以再展开一些，加入具体例子或细节会让表达更有说服力。');

  // 举例检测
  const exampleWords=['例如','比如','举个例子','记得','有一次','上次'];
  const hasExample = exampleWords.some(w=>answer.includes(w));
  if(hasExample){ scoreNum+=10; tips.push('✅ 用了具体例子来支撑观点，很好！'); }
  else tips.push('💡 可以加入一个具体例子（"比如…"），让抽象观点变生动。');

  // 题型特定建议
  if(type==='impromptu'){
    if(len<150) tips.push('🎤 即兴口述建议练习时多说一些，模拟真实场景的连贯表达。');
    else tips.push('✅ 篇幅适中，即兴表达有完整度。');
  } else if(type==='logic'){
    if(!hasStruct) tips.push('🧠 逻辑简答重在结构化，建议用"总-分-总"框架组织回答。');
    else tips.push('✅ 逻辑框架完整，观点清晰。');
  } else if(type==='scenario'){
    const empathyWords=['理解','明白','体谅','辛苦','感谢','不好意思'];
    const hasEmpathy = empathyWords.some(w=>answer.includes(w));
    if(hasEmpathy){ scoreNum+=10; tips.push('✅ 体现了共情意识，沟通语气得体。'); }
    else tips.push('💡 情景沟通建议先共情/认可对方，再表达自己的立场。');
  } else if(type==='retell'){
    if(len>80) tips.push('✅ 复述内容完整，有概括能力。');
    else tips.push('📖 复述练习重在抓住核心要点，尝试更完整地概括。');
  }

  // 连贯性
  const connectors=['然后','接着','所以','因为','不过','但是','而且','另外'];
  const hasConn = connectors.some(w=>answer.includes(w));
  if(hasConn) scoreNum+=5;
  else tips.push('💡 多用连接词（然后、所以、不过），让表达更连贯。');

  if(difficulty==='advanced' && len<150){
    tips.push('⚡ 进阶模式要求更高，建议深入展开，字数至少200字。');
  }

  scoreNum=Math.min(scoreNum,95);
  let score;
  if(scoreNum>=85) score='优秀';
  else if(scoreNum>=70) score='良好';
  else if(scoreNum>=60) score='合格';
  else score='需提升';

  return { score, tips };
}

let _exprTimerInterval=null;
function exprStartTimer(el){
  const p=window._exprPractice;
  if(!p) return;
  let total=p.duration*60;
  const disp=el.querySelector('#exprTimerDisp');
  const startBtn=el.querySelector('#exprTimerStart');
  if(_exprTimerInterval){ clearInterval(_exprTimerInterval); _exprTimerInterval=null; }
  startBtn.textContent='⏸ 暂停'; startBtn.classList.add('stop');
  _exprTimerInterval=setInterval(()=>{
    total--;
    if(total<=0){
      clearInterval(_exprTimerInterval); _exprTimerInterval=null;
      if(disp) disp.textContent='00:00';
      if(startBtn){ startBtn.textContent='✅ 完成'; startBtn.classList.remove('stop'); }
      showToast('⏰ 时间到！可以提交你的回答了');
      return;
    }
    const m=Math.floor(total/60), s=total%60;
    if(disp) disp.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
}
function exprStopTimer(el){
  if(_exprTimerInterval){ clearInterval(_exprTimerInterval); _exprTimerInterval=null; }
  const startBtn=el.querySelector('#exprTimerStart');
  if(startBtn){ startBtn.textContent='▶ 继续'; startBtn.classList.remove('stop'); }
}

function bindExpression(el){
  // 难度切换
  el.querySelectorAll('[data-diff]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._exprDifficulty=btn.dataset.diff;
      renderModule('expression');
    });
  });

  // 题型选择
  el.querySelectorAll('[data-exprtype]').forEach(card=>{
    card.addEventListener('click',()=>{
      const type=card.dataset.exprtype;
      const q=exprGetQuestion(type);
      window._exprPractice={ type, question:q, duration:3, draft:'' };
      window._exprView='practice';
      renderModule('expression');
    });
  });

  // 视图切换
  el.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._exprView=btn.dataset.view;
      if(btn.dataset.view==='home') window._exprPractice=null;
      if(_exprTimerInterval){ clearInterval(_exprTimerInterval); _exprTimerInterval=null; }
      renderModule('expression');
    });
  });

  // 练习页 — 计时器
  const startBtn=el.querySelector('#exprTimerStart');
  if(startBtn){
    startBtn.addEventListener('click',()=>{
      if(startBtn.textContent.includes('开始')||startBtn.textContent.includes('继续')){
        exprStartTimer(el);
      } else {
        exprStopTimer(el);
      }
    });
  }
  el.querySelector('#exprTimerReset')?.addEventListener('click',()=>{
    if(_exprTimerInterval){ clearInterval(_exprTimerInterval); _exprTimerInterval=null; }
    const p=window._exprPractice;
    if(p){
      const disp=el.querySelector('#exprTimerDisp');
      if(disp) disp.textContent=p.duration+':00';
      const sb=el.querySelector('#exprTimerStart');
      if(sb){ sb.textContent='▶ 开始'; sb.classList.remove('stop'); }
    }
  });
  // 时长预设
  el.querySelectorAll('[data-setdur]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=window._exprPractice;
      if(p){
        p.duration=parseInt(btn.dataset.setdur);
        if(_exprTimerInterval){ clearInterval(_exprTimerInterval); _exprTimerInterval=null; }
        renderModule('expression');
      }
    });
  });

  // 草稿输入
  const draftTA=el.querySelector('#exprDraft');
  if(draftTA){
    draftTA.addEventListener('input',()=>{
      if(window._exprPractice) window._exprPractice.draft=draftTA.value;
    });
  }

  // 参考思路
  el.querySelector('#exprShowRef')?.addEventListener('click',()=>{
    const p=window._exprPractice;
    if(!p) return;
    const ref=EXPR_REFERENCE[p.type]||'';
    const wrap=el.querySelector('#exprReviewWrap');
    if(wrap){
      wrap.innerHTML=`<div class="expr-review"><div class="review-title">💡 参考思路</div><div class="review-content"><p>${escHtml(ref)}</p></div></div>`;
    }
  });

  // AI点评
  el.querySelector('#exprReview')?.addEventListener('click',()=>{
    const p=window._exprPractice;
    if(!p) return;
    const answer=draftTA?.value?.trim()||'';
    const result=exprAIReview(p.type, window._exprDifficulty, p.question, answer);
    // 如果有录音，增加口述表达专项建议
    let oralTips='';
    if(p._audioBlob){
      const audioDuration=_recSeconds>0 ? Math.floor(_recSeconds/60)+'分'+(_recSeconds%60)+'秒' : '';
      oralTips=`
        <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">
          <p style="font-weight:600;color:var(--olive);margin-bottom:6px;">🎙️ 口述表达专项建议</p>
          <p>📊 录音时长：${audioDuration||'未知'} | 题型：${EXPR_TYPES.find(t=>t.id===p.type)?.name||''}</p>
          <p>💡 回听你的录音时，注意检查以下几点：</p>
          <p>• 语速是否适中？过快的语速可能让听众跟不上，建议用正常对话语速</p>
          <p>• 有没有频繁的"嗯"、"那个"等口头禅？可以刻意减少填充词</p>
          <p>• 语调是否有起伏？平铺直叙容易让人走神，适当加重关键词</p>
          <p>• 逻辑是否连贯？每个观点之间是否有自然的过渡？</p>
          <p>• 时长是否合理？${p.type==='impromptu'?'即兴口述建议控制在2-3分钟':p.type==='logic'?'逻辑简答建议控制在2-4分钟':'建议控制在1-3分钟'}以内</p>
          <p style="margin-top:8px;font-size:12px;color:var(--text3)">📝 建议：把自己当作听众回听一遍，标记需要改进的地方</p>
        </div>`;
    }
    const wrap=el.querySelector('#exprReviewWrap');
    if(wrap){
      wrap.innerHTML=`
        <div class="expr-review">
          <div class="review-title">🤖 AI点评结果</div>
          <div class="review-score">${result.score}</div>
          <div class="review-content">${result.tips.map(t=>`<p>${escHtml(t)}</p>`).join('')}${oralTips}</div>
        </div>`;
    }
    if(window._exprPractice) window._exprPractice.review=result.score;
  });

  // 完成打卡
  el.querySelector('#exprDone')?.addEventListener('click',()=>{
    const p=window._exprPractice;
    if(!p) return;
    const answer=draftTA?.value?.trim()||'';
    const hasAudio=!!p._audioBlob;
    if(answer.length<10 && !hasAudio){ showToast('请先写下你的回答或完成录音再打卡'); return; }
    exprUpdateStreak();
    exprIdCounter++;
    expressionRecords.push({
      id:exprIdCounter,
      date:todayStr(),
      type:p.type,
      difficulty:window._exprDifficulty,
      question:p.question,
      draft:answer,
      review:p.review||'',
      duration:p.duration,
      hasAudio:hasAudio,
      audioDuration:hasAudio ? _recSeconds : 0
    });
    save(LS_EXPRESSION, expressionRecords);
    if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
    // 清理录音资源
    recCleanup();
    window._exprPractice=null;
    window._exprView='home';
    renderModule('expression');
    showToast('🎉 打卡成功！连续'+exprStreak.count+'天');
  });

  // 历史展开
  el.querySelectorAll('.h-expand').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const draft=btn.previousElementSibling;
      if(draft){ draft.classList.toggle('expanded'); btn.textContent=draft.classList.contains('expanded')?'收起':'展开全部'; }
    });
  });

  // ---------- 录音功能 ----------
  let _recMediaRecorder=null;
  let _recChunks=[];
  let _recTimer=null;
  let _recSeconds=0;

  function recUpdateTime(){
    _recSeconds++;
    const m=Math.floor(_recSeconds/60), s=_recSeconds%60;
    const timeEl=el.querySelector('#exprRecTime');
    if(timeEl) timeEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function recCleanup(){
    if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
    if(_recMediaRecorder && _recMediaRecorder.state!=='inactive'){
      _recMediaRecorder.stop();
    }
    _recMediaRecorder=null;
    _recChunks=[];
    _recSeconds=0;
  }

  async function recStart(){
    // 先请求麦克风权限
    try {
      const stream=await navigator.mediaDevices.getUserMedia({ audio:true });
      const mr=new MediaRecorder(stream, { mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm' });
      _recMediaRecorder=mr;
      _recChunks=[];
      _recSeconds=0;

      mr.ondataavailable=e=>{ if(e.data.size>0) _recChunks.push(e.data); };
      mr.onstop=()=>{
        // 停止所有轨道
        stream.getTracks().forEach(t=>t.stop());
        // 创建blob用于回放
        const blob=new Blob(_recChunks, { type:'audio/webm' });
        const url=URL.createObjectURL(blob);
        // 显示回放
        const pbRow=el.querySelector('#exprPlayback');
        const player=el.querySelector('#exprAudioPlayer');
        if(pbRow) pbRow.classList.add('show');
        if(player){ player.src=url; player.load(); }
        // 存储到练习状态
        if(window._exprPractice) window._exprPractice._audioBlob=blob;
        // 更新UI
        const btn=el.querySelector('#exprRecBtn');
        if(btn){ btn.textContent='🔄 重新录音'; btn.className='expr-rec-btn rec-start'; }
        const statusEl=el.querySelector('#exprRecStatus');
        const barsEl=el.querySelector('#exprAudioBars');
        if(statusEl) statusEl.style.display='none';
        if(barsEl) barsEl.classList.remove('show');
        if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
        showToast('✅ 录音完成，可点击播放回听');
      };

      mr.start();
      // UI更新
      const btn=el.querySelector('#exprRecBtn');
      if(btn){ btn.textContent='⏹ 停止录音'; btn.className='expr-rec-btn rec-recording'; }
      const statusEl=el.querySelector('#exprRecStatus');
      const barsEl=el.querySelector('#exprAudioBars');
      if(statusEl) statusEl.style.display='flex';
      if(barsEl) barsEl.classList.add('show');
      const timeEl=el.querySelector('#exprRecTime');
      if(timeEl) timeEl.textContent='00:00';
      // 启动计时
      _recTimer=setInterval(recUpdateTime, 1000);
      showToast('🎙️ 录音中，请开始口述回答...');
    } catch(err){
      console.error('麦克风权限被拒绝或设备不可用:', err);
      showToast('⚠️ 无法访问麦克风，请检查浏览器权限设置');
    }
  }

  function recStop(){
    if(_recMediaRecorder && _recMediaRecorder.state==='recording'){
      _recMediaRecorder.stop();
    }
    if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
  }

  el.querySelector('#exprRecBtn')?.addEventListener('click',()=>{
    const btn=el.querySelector('#exprRecBtn');
    if(!btn) return;
    if(btn.classList.contains('rec-recording')){
      // 正在录音，停止
      recStop();
    } else {
      // 开始/重新录音
      recStart();
    }
  });

  // 删除录音
  el.querySelector('#exprDelAudio')?.addEventListener('click',()=>{
    const player=el.querySelector('#exprAudioPlayer');
    const pbRow=el.querySelector('#exprPlayback');
    if(player) player.src='';
    if(pbRow) pbRow.classList.remove('show');
    if(window._exprPractice) window._exprPractice._audioBlob=null;
    const btn=el.querySelector('#exprRecBtn');
    if(btn){ btn.textContent='🎙️ 开始录音'; btn.className='expr-rec-btn rec-start'; }
    showToast('🗑 录音已删除');
  });

  // 页面离开时清理录音资源
  const exprCard=el.closest('.module-card');
  if(exprCard){
    // 使用MutationObserver监听模块切换来清理
    const observer=new MutationObserver(()=>{
      if(!document.contains(exprCard)){
        recCleanup();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList:true, subtree:true });
  }
}


// ---------- 自定义模块（纯笔记型） ----------
function renderCustomModule(mod) {
  const key = 'cw_custom_'+mod.id;
  const content = localStorage.getItem(key) || '';
  return `
    <textarea style="width:100%;min-height:160px;padding:12px;border:1px solid var(--border);
      border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);resize:vertical;
      outline:none;line-height:1.6;background:#FFF;"
      class="custom-textarea" data-mid="${mod.id}"
      placeholder="在这里记录…">${escHtml(content)}</textarea>
  `;
}

function bindCustomModule(el, mod) {
  const ta = el.querySelector('.custom-textarea');
  if(ta) {
    ta.addEventListener('input', function() {
      localStorage.setItem('cw_custom_'+mod.id, this.value);
    });
  }
}

// ---------- 渲染单个模块 ----------
function renderModule(mid) {
  const container = document.querySelector(`[data-section="${mid}"]`);
  if(!container) return;
  const mod = modules.find(m=>m.id===mid);
  if(!mod) return;

  let html = '';
  switch(mid) {
    case 'daily-plan':  html = renderDailyPlan(); break;
    case 'inspiration': html = renderInspiration(); break;
    case 'hot-remix':   html = renderHotRemix(); break;
    case 'review':      html = renderReview(); break;
    case 'memo':        html = renderMemo(); break;
    case 'finance':     html = renderFinance(); break;
    case 'exercise':    html = renderExercise(); break;
    case 'expression':  html = renderExpression(); break;
    default:            html = renderCustomModule(mod); break;
  }

  const card = container.querySelector('.card');
  if(card) card.innerHTML = html;

  // 绑定事件
  switch(mid) {
    case 'daily-plan':  bindDailyPlan(card); break;
    case 'inspiration': bindInspiration(card); break;
    case 'hot-remix':   bindHotRemix(card); break;
    case 'review':      bindReview(card); break;
    case 'memo':        bindMemo(card); break;
    case 'finance':     bindFinance(card); break;
    case 'exercise':    bindExercise(card); break;
    case 'expression':  bindExpression(card); break;
    default:            bindCustomModule(card, mod); break;
  }
}

// ---------- 全部渲染 ----------
function renderAll() {
  renderDrawer();
  const main = $('#mainContent');

  main.innerHTML = modules.map(mod => `
    <div class="module${mod.id===activeModuleId?' active':''}" data-section="${mod.id}">
      <div class="module-title">${mod.icon} ${mod.name}</div>
      <div class="card"></div>
    </div>
  `).join('');

  // 渲染第一个激活模块
  if(activeModuleId && modules.find(m=>m.id===activeModuleId)) {
    renderModule(activeModuleId);
  } else if(modules.length) {
    activeModuleId = modules[0].id;
    renderModule(activeModuleId);
  }
}

/* ============================================================
   模块管理弹窗
   ============================================================ */
function renderModuleManager() {
  const list = $('#modList');
  list.innerHTML = modules.map(m => `
    <div class="mod-row">
      <span class="mod-icon">${m.icon}</span>
      <span class="mod-name">${m.name}</span>
      ${m.builtin ? '<span style="font-size:11px;color:var(--text3)">内置</span>' :
        `<button class="mod-remove" data-mid="${m.id}" title="删除模块">×</button>`}
    </div>
  `).join('');

  list.querySelectorAll('.mod-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const mid = btn.dataset.mid;
      modules = modules.filter(m=>m.id!==mid);
      // 清理该模块的localStorage
      localStorage.removeItem('cw_custom_'+mid);
      save(LS_MODULES, modules);
      if(activeModuleId === mid) activeModuleId = modules.length ? modules[0].id : '';
      renderAll();
      renderModuleManager();
      showToast('模块已删除');
    });
  });
}

/* ============================================================
   热点数据拉取 — 同源静态文件优先，Gist降级，自动拉取
   ============================================================ */
async function fetchHotData() {
  if(dataFetching) return;
  dataFetching = true;
  const btn = $('#syncBtn');
  if(btn) btn.classList.add('loading');
  // 刷新时立即更新视图显示loading
  renderModule('inspiration');
  renderModule('hot-remix');

  let success = false;

  // 策略1：从同源静态文件拉取（GitHub Pages 上的 inspire.json / remix.json，无限流）
  try {
    const [respI, respR] = await Promise.all([
      fetch('./inspire.json', {cache:'no-store'}),
      fetch('./remix.json', {cache:'no-store'})
    ]);
    if(respI.ok && respR.ok) {
      const iData = await respI.json();
      const rData = await respR.json();
      if(Array.isArray(iData) && iData.length) {
        inspireData = iData; save(LS_INSPIRE, inspireData);
      }
      if(Array.isArray(rData) && rData.length) {
        remixData = rData; save(LS_REMIX, remixData);
      }
      const lastMod = respI.headers.get('last-modified');
      dataUpdatedAt = lastMod ? new Date(lastMod).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      localStorage.setItem('cw_data_updated_at', dataUpdatedAt);
      success = true;
      console.log('[热点] 同源文件拉取成功');
    }
  } catch(e) {
    console.log('[热点] 同源拉取失败，尝试Gist降级:', e.message);
  }

  // 策略2：Gist API 降级（如果同源失败且配了Gist ID）
  if(!success && GIST_ID) {
    try {
      const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`);
      if(resp.ok) {
        const gist = await resp.json();
        const files = gist.files || {};
        const inspireFile = files['inspire.json'] || files['选题灵感.json'];
        const remixFile   = files['remix.json']   || files['二创角度.json'];
        if(inspireFile?.content) {
          const d = JSON.parse(inspireFile.content);
          if(Array.isArray(d) && d.length) { inspireData = d; save(LS_INSPIRE, inspireData); }
        }
        if(remixFile?.content) {
          const d = JSON.parse(remixFile.content);
          if(Array.isArray(d) && d.length) { remixData = d; save(LS_REMIX, remixData); }
        }
        const gistDate = gist.updated_at || gist.created_at;
        dataUpdatedAt = gistDate ? new Date(gistDate).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        localStorage.setItem('cw_data_updated_at', dataUpdatedAt);
        success = true;
        console.log('[热点] Gist降级拉取成功');
      }
    } catch(e) {
      console.log('[热点] Gist降级也失败:', e.message);
    }
  }

  dataFetching = false;
  if(btn) btn.classList.remove('loading');
  renderModule('inspiration');
  renderModule('hot-remix');
  showToast(success ? '✅ 热点已刷新' : '⚠️ 拉取失败，请稍后重试');
}

// 自动拉取：数据为空 或 超过12小时未更新时触发
function autoFetchIfNeeded() {
  if(dataFetching) return;
  const empty = !inspireData.length && !remixData.length;
  let stale = false;
  if(dataUpdatedAt) {
    // 简单判断：如果时间戳不含今天日期则视为过期
    const today = new Date();
    const todayStr = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    if(!dataUpdatedAt.includes(todayStr)) stale = true;
  } else {
    stale = true;
  }
  if(empty || stale) {
    console.log('[热点] 数据为空或过期，自动拉取');
    fetchHotData();
  }
}

$('#syncBtn').addEventListener('click', fetchHotData);

/* ============================================================
   App 唤起
   ============================================================ */
function openDouyin(keyword) {
  const encoded = encodeURIComponent(keyword||'');
  // 优先尝试 URL Scheme，失败则跳网页
  const scheme = `snssdk1128://search?keyword=${encoded}`;
  const fallback = `https://www.douyin.com/search/${encoded}`;
  tryOpen(scheme, fallback);
}
function openXiaohongshu(keyword) {
  const encoded = encodeURIComponent(keyword||'');
  const scheme = `xhsdiscover://search?keyword=${encoded}`;
  const fallback = `https://www.xiaohongshu.com/search_result?keyword=${encoded}`;
  tryOpen(scheme, fallback);
}
function tryOpen(scheme, fallback) {
  const start = Date.now();
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = scheme;
  document.body.appendChild(iframe);
  setTimeout(() => {
    document.body.removeChild(iframe);
    if(Date.now()-start < 2500) {
      window.open(fallback, '_blank');
    }
  }, 2000);
}

// 通用来源链接打开：自动检测平台，优先唤起App，兜底打开网页
function openSourceUrl(url, platform) {
  if(!url) return;
  const lowerUrl = url.toLowerCase();
  const lowerPlat = (platform||'').toLowerCase();

  // 抖音：snssdk1128:// webview
  if(lowerUrl.includes('douyin.com') || lowerPlat.includes('抖音')) {
    const encoded = encodeURIComponent(url);
    tryOpen(`snssdk1128://webview?url=${encoded}`, url);
    return;
  }

  // 小红书：xhsdiscover:// webview
  if(lowerUrl.includes('xiaohongshu.com') || lowerPlat.includes('小红书')) {
    tryOpen(`xhsdiscover://webview?url=${encodeURIComponent(url)}`, url);
    return;
  }

  // 微博：sinaweibo:// 或直接浏览器打开
  if(lowerUrl.includes('weibo.com') || lowerPlat.includes('微博')) {
    tryOpen(`sinaweibo://browser?url=${encodeURIComponent(url)}`, url);
    return;
  }

  // 微信/公众号：浏览器打开（微信url scheme限制多，直接用浏览器更稳妥）
  // 其他链接：直接浏览器打开
  window.open(url, '_blank');
}

/* ============================================================
   工具函数
   ============================================================ */
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tagLabel(t) {
  const map = { trend:'趋势', douyin:'抖音', xhs:'小红书', wechat:'微信' };
  return map[t] || t;
}
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

   页面加载

renderAll();

setTimeout(autoFetchIfNeeded, 800);
