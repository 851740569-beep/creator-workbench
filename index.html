function finOpenCatMgmtModal(){
  const overlay=document.createElement('div');
  overlay.className='fin-modal-overlay';
  const isDefault=(c)=>DEFAULT_EXPENSE_CATS.includes(c)||DEFAULT_INCOME_CATS.includes(c);
  const renderCatList=(type)=>{
    const cats = type==='income'?(financeCats.income||DEFAULT_INCOME_CATS):(financeCats.expense||DEFAULT_EXPENSE_CATS);
    return cats.map(c=>`
      <div class="fin-cat-row" data-cat="${escHtml(c)}" data-type="${type}">
        <span class="fin-cat-drag" title="拖动排序">⠿</span>
        <span class="fin-cat-emoji">${finCatIcon(c)}</span>
        <span class="fin-cat-label">${escHtml(c)}</span>
        ${isDefault(c)?'<span class="fin-cat-default">默认</span>':`<button class="fin-cat-del-btn" data-delcat="${escHtml(c)}" data-deltype="${type}" aria-label="删除">×</button>`}
      </div>`).join('');
  };
  overlay.innerHTML=`
    <div class="fin-modal">
      <div class="fin-modal-head">
        <div class="fin-modal-title">🏷️ 分类管理</div>
        <button class="fin-modal-close" aria-label="关闭">×</button>
      </div>
      <div class="fin-form-row">
        <div class="fin-modal-section-label">支出分类（拖动 ⠿ 可调整顺序）</div>
        <div id="finCatListExpense">${renderCatList('expense')}</div>
        <div class="fin-cat-mgmt-add">
          <input type="text" id="finNewCatExpense" placeholder="新增支出分类…"/>
          <button id="finAddCatExpense">添加</button>
        </div>
      </div>
      <div class="fin-form-row">
        <div class="fin-modal-section-label">收入分类（拖动 ⠿ 可调整顺序）</div>
        <div id="finCatListIncome">${renderCatList('income')}</div>
        <div class="fin-cat-mgmt-add">
          <input type="text" id="finNewCatIncome" placeholder="新增收入分类…"/>
          <button id="finAddCatIncome">添加</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('open'),10);

  const enableCatDrag=(listEl, type)=>{
    let dragEl=null, ghost=null;
    const rows=()=>[...listEl.querySelectorAll('.fin-cat-row')];
    listEl.querySelectorAll('.fin-cat-drag').forEach(h=>h.addEventListener('pointerdown', e=>{
      dragEl = e.target.closest('.fin-cat-row');
      if(!dragEl) return;
      e.preventDefault();
      const rect = dragEl.getBoundingClientRect();
      ghost = dragEl.cloneNode(true);
      ghost.classList.add('fin-cat-drag-ghost');
      ghost.style.width = rect.width+'px';
      ghost.style.left = rect.left+'px';
      ghost.style.top = rect.top+'px';
      document.body.appendChild(ghost);
      dragEl.classList.add('fin-cat-dragging');
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }));
    const onMove=(e)=>{
      if(!dragEl) return;
      ghost.style.top = (e.clientY - 22)+'px';
      const siblings = rows().filter(r=>r!==dragEl);
      let inserted=false;
      for(const sib of siblings){
        const rb = sib.getBoundingClientRect();
        if(e.clientY < rb.top + rb.height/2){ listEl.insertBefore(dragEl, sib); inserted=true; break; }
      }
      if(!inserted) listEl.appendChild(dragEl);
    };
    const onUp=()=>{
      if(!dragEl) return;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if(ghost){ ghost.remove(); ghost=null; }
      dragEl.classList.remove('fin-cat-dragging');
      financeCats[type] = rows().map(r=>r.dataset.cat);
      save(LS_FIN_CATS, financeCats);
      dragEl=null;
    };
  };

  const refresh=()=>{
    overlay.querySelector('#finCatListExpense').innerHTML=renderCatList('expense');
    overlay.querySelector('#finCatListIncome').innerHTML=renderCatList('income');
    enableCatDrag(overlay.querySelector('#finCatListExpense'),'expense');
    enableCatDrag(overlay.querySelector('#finCatListIncome'),'income');
    bindDels();
  };
  const bindDels=()=>{
    overlay.querySelectorAll('.fin-cat-del-btn').forEach(b=>{
      b.onclick=()=>{
        const cat=b.dataset.delcat, type=b.dataset.deltype;
        financeCats[type]=financeCats[type].filter(c=>c!==cat);
        save(LS_FIN_CATS, financeCats); refresh();
      };
    });
  };
  refresh();
  overlay.querySelector('.fin-modal-close').addEventListener('click',()=>finCloseModal(overlay));
  overlay.addEventListener('click',e=>{ if(e.target===overlay) finCloseModal(overlay); });
  overlay.querySelector('#finAddCatExpense').addEventListener('click',()=>{
    const v=overlay.querySelector('#finNewCatExpense').value.trim();
    if(!v){ showToast('请输入分类名称'); return; }
    if(!financeCats.expense.includes(v)){ financeCats.expense.push(v); save(LS_FIN_CATS,financeCats); overlay.querySelector('#finNewCatExpense').value=''; refresh(); showToast('✅ 已添加'); }
    else showToast('该分类已存在');
  });
  overlay.querySelector('#finAddCatIncome').addEventListener('click',()=>{
    const v=overlay.querySelector('#finNewCatIncome').value.trim();
    if(!v){ showToast('请输入分类名称'); return; }
    if(!financeCats.income.includes(v)){ financeCats.income.push(v); save(LS_FIN_CATS,financeCats); overlay.querySelector('#finNewCatIncome').value=''; refresh(); showToast('✅ 已添加'); }
    else showToast('该分类已存在');
  });
}

function finExportData(fmt){
  if(!financeRecords.length){ showToast('暂无数据可导出'); return; }
  let content, filename, mime;
  if(fmt==='json'){
    content=JSON.stringify(financeRecords,null,2);
    filename='finance_records.json'; mime='application/json';
  } else {
    const header='日期,类型,分类,金额,备注\n';
    const rows=financeRecords.map(r=>`${r.date},${r.type==='income'?'收入':'支出'},${r.category||''},${r.amount},${r.note||''}`).join('\n');
    content='\ufeff'+header+rows;
    filename='finance_records.csv'; mime='text/csv;charset=utf-8';
  }
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 已导出 '+filename);
}

function finBackup(){
  const data={ records:financeRecords, budget:financeBudget, cats:financeCats };
  const content=JSON.stringify(data,null,2);
  const blob=new Blob([content],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='finance_backup_'+todayStr()+'.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 备份文件已下载');
}

function bindFinance(el) {
  if(!el){ console.warn('bindFinance: el is null'); return; }
  // 底部导航切换
  el.querySelectorAll('.fin-nav-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._finTab = btn.dataset.fintab;
      renderModule('finance');
    });
  });

  // 首页 — 快捷按钮
  el.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.addEventListener('click',()=> finOpenModal(btn.dataset.quick));
  });

  // 首页 — 分类点击快速记账
  el.querySelectorAll('.fin-cat-item').forEach(item=>{
    item.addEventListener('click',e=>{
      if(item.dataset.addcat){ finOpenCatMgmtModal(); return; }
      finOpenModal(item.dataset.type, item.dataset.cat);
    });
  });

  // 账单页 — 类型筛选下拉
  el.querySelector('#finBillTypeFilter')?.addEventListener('change',e=>{
    window._finBillFilter = e.target.value;
    renderModule('finance');
  });
  // 账单页 — 年份切换
  el.querySelector('#finBillYearSel')?.addEventListener('change',e=>{
    window._finBillYear = parseInt(e.target.value);
    renderModule('finance');
  });
  // 账单页 — 月份切换
  el.querySelector('#finBillMonthSel')?.addEventListener('change',e=>{
    window._finBillMonth = parseInt(e.target.value);
    renderModule('finance');
  });
  // 账单页 — 删除
  el.querySelectorAll('.bill-del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const fid=+btn.closest('.fin-bill-item').dataset.fid;
      financeRecords=financeRecords.filter(r=>r.id!==fid);
      save(LS_FINANCE, financeRecords);
      renderModule('finance');
      showToast('已删除');
    });
  });

  // 统计页 — 周期切换
  el.querySelectorAll('[data-period]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window._finStatsPeriod=btn.dataset.period;
      renderModule('finance');
    });
  });

  // 我的页面 — 设置项
  el.querySelectorAll('[data-set]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const action=btn.dataset.set;
      if(action==='budget') finOpenBudgetModal();
      else if(action==='catmgmt') finOpenCatMgmtModal();
      else if(action==='export') finExportData('csv');
      else if(action==='backup') finBackup();
      else if(action==='clear'){
        if(confirm('⚠️ 确定清除所有记账数据？此操作不可恢复！')){
          financeRecords=[]; financeIdCounter=0; financeBudget=0;
          financeCats={expense:[...DEFAULT_EXPENSE_CATS],income:[...DEFAULT_INCOME_CATS]};
          save(LS_FINANCE,financeRecords); save(LS_FIN_BUDGET,0); save(LS_FIN_CATS,financeCats);
          renderModule('finance');
          showToast('已清除所有数据');
        }
      }
    });
  });
}

function renderExercise() {
  // 按日期分组最近的记录
  const recent = [...exerciseRecords].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,60);
  const groups = {};
  recent.forEach(r=>{
    if(!groups[r.date]) groups[r.date]=[];
    groups[r.date].push(r);
  });

  const typeIcon = (t) => {
    const found = EXERCISE_TYPES.find(e=>e.val===t);
    return found ? found.icon : '🏅';
  };

  const recordsHTML = Object.keys(groups).sort().reverse().map(date => {
    const dayTotal = groups[date].reduce((s,r)=>s+(Number(r.duration)||0),0);
    return `
    <div class="ex-date-group">
      <div class="ex-date-label">📅 ${date}<span class="ex-date-total">共 ${dayTotal} 分钟</span></div>
      ${groups[date].map(r=>`
        <div class="ex-item" data-eid="${r.id}">
          <span class="ex-icon">${typeIcon(r.type)}</span>
          <div class="ex-info">
            <div class="ex-type-name">${escHtml(r.type||'运动')}</div>
            <div class="ex-meta"><span>⏱ ${r.duration||0}分钟</span></div>
            ${r.feeling ? `<div class="ex-feeling">💬 ${escHtml(r.feeling)}</div>` : ''}
          </div>
          <span class="ex-duration-badge">${r.duration||0}分钟</span>
          <button class="ex-del" title="删除">×</button>
        </div>
      `).join('')}
    </div>
  `}).join('');

  return `
    <div class="exercise-form">
      <div class="ex-row">
        <select class="ex-type" id="exType">${EXERCISE_TYPES.map(e=>`<option value="${e.val}">${e.icon} ${e.val}</option>`).join('')}</select>
        <input type="number" class="ex-duration" id="exDuration" placeholder="分钟" min="1" inputmode="numeric"/>
      </div>
      <textarea id="exFeeling" placeholder="运动感受（可选）…"></textarea>
      <button class="btn-primary" id="addExerciseBtn">💪 记录运动</button>
    </div>
    <div class="exercise-records">${recordsHTML || '<div class="empty-state" style="padding:20px;">🏃 还没有运动记录，开始记录吧！</div>'}</div>
  `;
}

function bindExercise(el) {
  el.querySelector('#addExerciseBtn')?.addEventListener('click', ()=>{
    const type = el.querySelector('#exType')?.value || '其他';

    if(duration <= 0) { showToast('请填写运动时长'); return; }

function englishGetDailyData(){
  const today = todayStr();
  if(englishData && englishData.date === today && englishData.difficulty === englishDifficulty) return englishData;
  // 生成每日数据
  const scenes = ENGLISH_SCENES;
  const words = ENGLISH_WORDS[englishDifficulty] || ENGLISH_WORDS.beginner;
  // 用日期做种子选择推荐
  const daySeed = parseInt(today.replace(/-/g,''));
  const sceneKeys = Object.keys(scenes);
  const recSceneKey = sceneKeys[daySeed % sceneKeys.length];
  const recScenePool = scenes[recSceneKey][englishDifficulty] || scenes[recSceneKey].beginner;
  const recScene = recScenePool[daySeed % recScenePool.length];
  // 选3个单词
  const wordIndices = [(daySeed)%words.length, (daySeed+1)%words.length, (daySeed+2)%words.length];
  const dailyWords = wordIndices.map(i=>words[i]);
  englishData = { date:today, difficulty:englishDifficulty, recSceneKey, recScene, dailyWords };
  save(LS_ENGLISH, englishData);
  return englishData;
}

function englishSpeak(text){
  if(!window.speechSynthesis){ showToast('当前浏览器不支持语音播放'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function englishUpdateProgress(){
  const today = todayStr();
  if(englishProgress.lastDate !== today){
    englishProgress.completed += 1;
    if(englishProgress.lastDate){
      const yest = new Date(); yest.setDate(yest.getDate()-1);
      if(englishProgress.lastDate === dateStr(yest)) englishProgress.streakDays += 1;
      else englishProgress.streakDays = 1;
    } else {
      englishProgress.streakDays = 1;
    }
    englishProgress.lastDate = today;
    englishProgress.difficulty = englishDifficulty;
    save(LS_ENGLISH_PROG, englishProgress);
  }
}

function exprUpdateStreak(){
  const today=todayStr();
  if(exprStreak.lastDate===today) return;
  const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yd=dateStr(yesterday);
  if(exprStreak.lastDate===yd || exprStreak.lastDate===''){
    exprStreak.count = exprStreak.lastDate==='' ? 1 : exprStreak.count+1;
  } else {
    exprStreak.count=1;
  }
  exprStreak.lastDate=today;
  save(LS_EXPR_STREAK, exprStreak);
}

function exprGetQuestion(type){

function exprAIReview(type, difficulty, question, answer){
  if(!answer||answer.trim().length<10){
    return { score:'需展开', logic:'-', fluency:'-', vocabulary:'-', tips:[
      '⚠️ 回答篇幅过短，建议至少展开100字以上。',
      '表达训练的核心是"说清楚"，尝试多展开一些细节。',
      '可以先列提纲，再逐点展开。'
    ], suggestion:''};
  }
  const text = answer.trim();
  const len = text.length;
  const sentences = text.split(/[。！？.!?]/).filter(s=>s.trim().length>0);
  const words = text.split(/\s+/).filter(w=>w.length>0);

  // === 1. 逻辑框架评分 ===
  let logicScore = 0;
  const structWords=['首先','其次','最后','第一','第二','第三','一方面','另一方面','总之','综上','因此','所以','但是','然而'];
  const hasStruct = structWords.some(w=>text.includes(w));
  if(hasStruct) logicScore += 25;
  else logicScore += 10;
  if(sentences.length >= 3) logicScore += 15;
  else logicScore += 5;
  if(len > 120) logicScore += 10;
  logicScore = Math.min(50, logicScore);

  // === 2. 语言流畅度评分 ===
  let fluencyScore = 0;
  const avgLen = sentences.length > 0 ? len / sentences.length : 0;
  if(avgLen >= 15 && avgLen <= 80) fluencyScore += 25;
  else fluencyScore += 10;
  const connectors=['然后','接着','所以','因为','不过','但是','而且','另外','此外','同时'];
  const connCount = connectors.reduce((c,w)=>c+(text.includes(w)?1:0),0);
  if(connCount >= 2) fluencyScore += 15;
  else if(connCount >= 1) fluencyScore += 8;
  // 检查重复词（简单指标）
  const wordFreq = {};
  words.forEach(w=>{ wordFreq[w]=(wordFreq[w]||0)+1; });
  const repeats = Object.values(wordFreq).filter(c=>c>2).length;
  if(repeats <= 2) fluencyScore += 10;
  else fluencyScore += 3;
  fluencyScore = Math.min(50, fluencyScore);

  // === 3. 用词优缺点 ===
  const goodWords = [];
  const advWords = ['深刻','关键','核心','本质','系统','全面','深入','独特','创新','高效'];
  const emoWords = ['感动','温暖','震撼','共鸣','启发','激励'];
  advWords.forEach(w=>{ if(text.includes(w)) goodWords.push(w); });
  emoWords.forEach(w=>{ if(text.includes(w)) goodWords.push(w); });

  const weakWords = [];
  const vague = ['那个','这个','东西','随便','可能大概'];
  const fillers = ['嗯','啊','哦','那个','就是'];
  vague.forEach(w=>{ if(text.includes(w)) weakWords.push(w); });
  fillers.forEach(w=>{ if(text.includes(w)) weakWords.push(w); });

  // === 综合评分 ===
  let total = logicScore + fluencyScore;
  // 举例加分
  const exampleWords=['例如','比如','举个例子','记得','有一次','上次','以','为例'];
  const hasExample = exampleWords.some(w=>text.includes(w));
  if(hasExample) total += 5;
  // 词汇丰富度
  const uniqueWords = new Set(words.map(w=>w.toLowerCase()));
  const richness = words.length > 0 ? uniqueWords.size / words.length : 0;
  if(richness > 0.6) total += 5;

  total = Math.min(95, total);
  let score;
  if(total>=85) score='优秀';
  else if(total>=70) score='良好';
  else if(total>=55) score='合格';
  else score='需提升';

  // === 生成点评文案 ===
  const tips = [];

  // 逻辑框架点评
  if(logicScore >= 40) tips.push('✅ 【逻辑框架】观点层次分明，结构清晰，使用了有效的连接词和分段论述。');
  else if(logicScore >= 25) tips.push('💡 【逻辑框架】整体有结构，但段落/观点之间的过渡可以更清晰。建议明确使用"首先/其次/最后"等引导词。');
  else tips.push('⚠️ 【逻辑框架】回答略显零散，建议先确定核心观点，再用2-3个论据支撑，最后总结升华。');

  // 流畅度点评
  if(fluencyScore >= 40) tips.push('✅ 【语言流畅度】表达连贯，句子长短搭配得当，阅读体验顺畅。');
  else if(fluencyScore >= 25) tips.push('💡 【语言流畅度】基本通顺，但部分句子过长或过短，建议适当调整句式节奏。');
  else tips.push('⚠️ 【语言流畅度】句子衔接不够自然，建议多使用连接词，避免过多的短句堆砌。');

  // 用词点评
  if(goodWords.length > 0) tips.push(`✅ 【用词亮点】使用了精准/生动的词汇：${goodWords.slice(0,3).join('、')}。`);
  if(weakWords.length > 0) tips.push(`💡 【用词建议】发现模糊/口头禅词汇：${weakWords.slice(0,3).join('、')}，建议替换为更具体的表达。`);

  // 题型特定建议
  if(type==='impromptu'){
    if(len<100) tips.push('🎤 【即兴专项】即兴口述建议控制在1-2分钟，内容要有开头引入、中间展开、结尾收束。');
    else tips.push('✅ 【即兴专项】即兴表达有完整度，继续保持"引入→展开→收束"的节奏感。');
  } else if(type==='logic'){
    if(!hasStruct) tips.push('🧠 【逻辑专项】逻辑简答重在结构化，建议用"总-分-总"框架：先亮观点，再分点论证，最后总结。');
    else tips.push('✅ 【逻辑专项】逻辑框架完整，论证过程有层次感。');
  } else if(type==='scenario'){
    const empathyWords=['理解','明白','体谅','辛苦','感谢','不好意思','抱歉'];
    const hasEmpathy = empathyWords.some(w=>text.includes(w));
    if(hasEmpathy) tips.push('✅ 【情景专项】体现了共情意识，沟通语气得体，这是情景沟通的关键。');
    else tips.push('💡 【情景专项】情景沟通建议先共情/认可对方（"我理解你的..."），再表达自己的立场或给出方案。');
  } else if(type==='retell'){
    if(len>60) tips.push('✅ 【复述专项】复述内容较完整，抓住了核心要点。');
    else tips.push('📖 【复述专项】复述练习重在抓住核心要点，尝试用自己的话更完整地概括原文。');
  }

  if(difficulty==='advanced' && len<120){
    tips.push('⚡ 【进阶提示】进阶模式要求更深入展开，建议字数至少150字以上，加入更多细节和论据。');
  }

  // 优化建议（综合）
  let suggestion = '';
  if(total >= 85){
    suggestion = '🌟 你的表达水平很不错！建议尝试更高难度的题目，或在表述中加入更具说服力的数据/案例，让观点更有分量。';
  } else if(total >= 70){
    suggestion = '📈 整体表达良好，继续保持！重点提升方向：' + (logicScore<fluencyScore?'加强逻辑框架的层次感，多用引导词串联观点。':'提升语言流畅度，注意句子衔接和节奏变化。');
  } else if(total >= 55){
    suggestion = '💪 表达有基础，但需要系统提升。建议：① 答题前先写3-5个关键词提纲 ② 每个观点配一个具体例子 ③ 回答完自己朗读一遍，检查是否通顺。';
  } else {
    suggestion = '🎯 建议从简易模式开始，每天坚持练习1-2题。每次回答后对照参考思路，学习它的结构和用词，逐步积累表达模板。';
  }

  return {
    score,
    logic: logicScore >= 40 ? '优秀' : logicScore >= 25 ? '良好' : '需提升',
    fluency: fluencyScore >= 40 ? '优秀' : fluencyScore >= 25 ? '良好' : '需提升',
    vocabulary: goodWords.length >= 2 ? '丰富' : goodWords.length >= 1 ? '尚可' : '可丰富',
    tips,
    suggestion
  };
}

let _exprTimerInterval=null;
function exprStartTimer(el){
  const p=window._exprPractice;
  if(!p) return;
  let total=p.duration*60;
  const disp=el.querySelector('#exprTimerDisp');
  const startBtn=el.querySelector('#exprTimerStart');
  if(_exprTimerInterval){ clearInterval(_exprTimerInterval); _exprTimerInterval=null; }
  startBtn.textContent='⏸ 暂停'; startBtn.classList.add('stop');
  _exprTimerInterval=setInterval(()=>{
    total--;
    if(total<=0){
      clearInterval(_exprTimerInterval); _exprTimerInterval=null;
      if(disp) disp.textContent='00:00';
      if(startBtn){ startBtn.textContent='✅ 完成'; startBtn.classList.remove('stop'); }
      showToast('⏰ 时间到！可以提交你的回答了');
      return;
    }
    const m=Math.floor(total/60), s=total%60;
    if(disp) disp.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
}

        <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">

          <p>• 语速是否适中？过快的语速可能让听众跟不上，建议用正常对话语速</p>
          <p>• 有没有频繁的"嗯"、"那个"等口头禅？可以刻意减少填充词</p>
          <p>• 语调是否有起伏？平铺直叙容易让人走神，适当加重关键词</p>
          <p>• 逻辑是否连贯？每个观点之间是否有自然的过渡？</p>
          <p>• 时长是否合理？${p.type==='impromptu'?'即兴口述建议控制在2-3分钟':p.type==='logic'?'逻辑简答建议控制在2-4分钟':'建议控制在1-3分钟'}以内</p>
          <p style="margin-top:8px;font-size:12px;color:var(--text3)">📝 建议：把自己当作听众回听一遍，标记需要改进的地方</p>
        </div>`;
    }
    const wrap=el.querySelector('#exprReviewWrap');
    if(wrap){
      wrap.innerHTML=`
        <div class="expr-review">
          <div class="review-title">🤖 AI点评结果</div>
          <div class="review-score">${result.score}</div>
          <div class="expr-review-dims">
            <div class="expr-dim"><span class="dim-label">逻辑框架</span><span class="dim-val dim-${result.logic==='优秀'?'good':result.logic==='良好'?'ok':'bad'}">${result.logic}</span></div>
            <div class="expr-dim"><span class="dim-label">语言流畅度</span><span class="dim-val dim-${result.fluency==='优秀'?'good':result.fluency==='良好'?'ok':'bad'}">${result.fluency}</span></div>
            <div class="expr-dim"><span class="dim-label">用词水平</span><span class="dim-val dim-${result.vocabulary==='丰富'?'good':result.vocabulary==='尚可'?'ok':'bad'}">${result.vocabulary}</span></div>
          </div>
          <div class="review-content">${result.tips.map(t=>`<p>${escHtml(t)}</p>`).join('')}</div>
          ${result.suggestion?`<div class="expr-suggestion"><strong>🎯 优化建议</strong><p>${escHtml(result.suggestion)}</p></div>`:''}
          ${oralTips}
        </div>`;
    }
    if(window._exprPractice) window._exprPractice.review=result.score;
  });

  // 完成打卡
  el.querySelector('#exprDone')?.addEventListener('click',()=>{
    const p=window._exprPractice;
    if(!p) return;
    const answer=draftTA?.value?.trim()||'';
    const hasAudio=!!p._audioBlob;
    const mode = p.answerMode || 'text';
    if(mode==='text' && answer.length<10){ showToast('文字作答请至少写10字再打卡'); return; }
    if(mode==='voice' && !hasAudio){ showToast('录音作答请先完成录音再打卡'); return; }
    exprUpdateStreak();
    exprIdCounter++;
    expressionRecords.push({
      id:exprIdCounter,
      date:todayStr(),
      type:p.type,
      difficulty:window._exprDifficulty,
      question:p.question,
      draft:answer,
      review:p.review||'',
      duration:p.duration,
      hasAudio:hasAudio,
      audioDuration:hasAudio ? _recSeconds : 0,
      answerMode:mode
    });
    save(LS_EXPRESSION, expressionRecords);
    if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
    // 清理录音资源
    recCleanup();
    window._exprPractice=null;
    window._exprView='home';
    renderModule('expression');
    showToast('🎉 打卡成功！连续'+exprStreak.count+'天');
  });

  // 历史展开
  el.querySelectorAll('.h-expand').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const draft=btn.previousElementSibling;
      if(draft){ draft.classList.toggle('expanded'); btn.textContent=draft.classList.contains('expanded')?'收起':'展开全部'; }
    });
  });

  // ---------- 录音功能 ----------
  let _recMediaRecorder=null;
  let _recChunks=[];
  let _recTimer=null;
  let _recSeconds=0;

  function recUpdateTime(){
    _recSeconds++;
    const m=Math.floor(_recSeconds/60), s=_recSeconds%60;
    const timeEl=el.querySelector('#exprRecTime');
    if(timeEl) timeEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function recCleanup(){
    if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
    if(_recMediaRecorder && _recMediaRecorder.state!=='inactive'){
      _recMediaRecorder.stop();
    }
    _recMediaRecorder=null;
    _recChunks=[];
    _recSeconds=0;
  }

  async function recStart(){
    // 先请求麦克风权限
    try {
      const stream=await navigator.mediaDevices.getUserMedia({ audio:true });
      const mr=new MediaRecorder(stream, { mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm' });
      _recMediaRecorder=mr;
      _recChunks=[];
      _recSeconds=0;

      mr.ondataavailable=e=>{ if(e.data.size>0) _recChunks.push(e.data); };
      mr.onstop=()=>{
        // 停止所有轨道
        stream.getTracks().forEach(t=>t.stop());
        // 创建blob用于回放
        const blob=new Blob(_recChunks, { type:'audio/webm' });
        const url=URL.createObjectURL(blob);
        // 显示回放
        const pbRow=el.querySelector('#exprPlayback');
        const player=el.querySelector('#exprAudioPlayer');
        if(pbRow) pbRow.classList.add('show');
        if(player){ player.src=url; player.load(); }
        // 存储到练习状态
        if(window._exprPractice) window._exprPractice._audioBlob=blob;
        // 更新UI
        const btn=el.querySelector('#exprRecBtn');
        if(btn){ btn.textContent='🔄 重新录音'; btn.className='expr-rec-btn rec-start'; }
        const statusEl=el.querySelector('#exprRecStatus');
        const barsEl=el.querySelector('#exprAudioBars');
        if(statusEl) statusEl.style.display='none';
        if(barsEl) barsEl.classList.remove('show');
        if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
        showToast('✅ 录音完成，可点击播放回听');
      };

      mr.start();
      // UI更新
      const btn=el.querySelector('#exprRecBtn');
      if(btn){ btn.textContent='⏹ 停止录音'; btn.className='expr-rec-btn rec-recording'; }
      const statusEl=el.querySelector('#exprRecStatus');
      const barsEl=el.querySelector('#exprAudioBars');
      if(statusEl) statusEl.style.display='flex';
      if(barsEl) barsEl.classList.add('show');
      const timeEl=el.querySelector('#exprRecTime');
      if(timeEl) timeEl.textContent='00:00';
      // 启动计时
      _recTimer=setInterval(recUpdateTime, 1000);
      showToast('🎙️ 录音中，请开始口述回答...');
    } catch(err){
      console.error('麦克风权限被拒绝或设备不可用:', err);
      showToast('⚠️ 无法访问麦克风，请检查浏览器权限设置');
    }
  }

  function recStop(){
    if(_recMediaRecorder && _recMediaRecorder.state==='recording'){
      _recMediaRecorder.stop();
    }
    if(_recTimer){ clearInterval(_recTimer); _recTimer=null; }
  }

  el.querySelector('#exprRecBtn')?.addEventListener('click',()=>{
    const btn=el.querySelector('#exprRecBtn');
    if(!btn) return;
    if(btn.classList.contains('rec-recording')){
      // 正在录音，停止
      recStop();
    } else {
      // 开始/重新录音
      recStart();
    }
  });

  // 删除录音
  el.querySelector('#exprDelAudio')?.addEventListener('click',()=>{
    const player=el.querySelector('#exprAudioPlayer');
    const pbRow=el.querySelector('#exprPlayback');
    if(player) player.src='';
    if(pbRow) pbRow.classList.remove('show');
    if(window._exprPractice) window._exprPractice._audioBlob=null;
    const btn=el.querySelector('#exprRecBtn');
    if(btn){ btn.textContent='🎙️ 开始录音'; btn.className='expr-rec-btn rec-start'; }
    showToast('🗑 录音已删除');
  });

  // 页面离开时清理录音资源
  const exprCard=el.closest('.module-card');
  if(exprCard){
    // 使用MutationObserver监听模块切换来清理
    const observer=new MutationObserver(()=>{
      if(!document.contains(exprCard)){
        recCleanup();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList:true, subtree:true });
  }
}

            <input type="checkbox" class="checkin-check" ${item.done?'checked':''} />
            <span class="checkin-icon">${item.icon}</span>
            <span class="checkin-text">${item.name}</span>
          </div>
        `).join('')}
      </div>
      <div class="checkin-progress">
        <div class="checkin-circle">
          <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" stroke="#F0D8E0"/><circle cx="26" cy="26" r="22" stroke="var(--pink)" stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" id="checkinProgressCircle"/></svg>
          ${pct}%
        </div>
        <div class="checkin-stats">
          <div class="checkin-stat-row"><span>已完成</span><b>${doneCount}/${totalCount}</b></div>
          <div class="checkin-stat-row"><span>完成率</span><b>${pct}%</b></div>
          <div class="checkin-stat-row"><span>记录模式</span><b>${homeMode==='daily'?'每日重置':'累积记录'}</b></div>
        </div>
      </div>
      <!-- 今日计划（来自每日计划模块） -->
      <div class="home-plan-section">
        <div class="home-plan-header">
          <span class="home-plan-title">📝 今日计划</span>
          <span class="home-plan-count">${tasks.filter(t=>t.date===todayStr()).length} 项</span>
        </div>
        <div class="home-plan-list">
          ${tasks.filter(t=>t.date===todayStr()).map(t=>`
            <div class="home-plan-item ${t.done?'done':''}" data-planid="${t.id}">
              <span class="home-plan-check">${t.done?'✅':'⭕'}</span>
              <span class="home-plan-text">${escHtml(t.text)}</span>
            </div>
          `).join('') || '<div class="home-plan-empty">暂无今日计划，去「每日计划」添加吧 ✨</div>'}
        </div>
      </div>
    </div>

    <!-- 励志语录 -->
    <div class="home-quote-card">
      <div class="quote-cn"><span class="quote-icon">❤️</span>${quote.cn}</div>
      <div class="quote-en">${quote.en}</div>
    </div>

    <!-- 记录模式切换 -->
    <div class="home-mode-switch">
      <button class="mode-btn ${homeMode==='daily'?'active':''}" data-mode="daily">📅 每日重置模式</button>
      <button class="mode-btn ${homeMode==='cumulative'?'active':''}" data-mode="cumulative">📊 累积记录模式</button>
    </div>

    <!-- 全部功能概览 -->
    <div class="module-title">📋 全部功能概览</div>
    <div class="home-func-grid">${funcHTML}</div>
  `;
}

function bindHome(el){
  // 时钟更新
  function updateClock(){
    const tEl = el.querySelector('#homeClockTime');
    if(!tEl) return;
    const now = new Date();
    tEl.textContent = [now.getHours(),now.getMinutes(),now.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  }
  window._homeClockInt = setInterval(updateClock, 1000);

  // 打卡项点击
  el.querySelectorAll('.checkin-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const cid = parseInt(item.dataset.cid);
      const ci = checkinItems.find(c=>c.id===cid);
      if(ci){
        ci.done = !ci.done;
        item.classList.toggle('done', ci.done);
        const chk = item.querySelector('.checkin-check');
        if(chk) chk.checked = ci.done;
        save(LS_CHECKIN, checkinItems);
        // 更新连续天数
        updateCheckinStreak();
        // 更新进度圆环
        refreshCheckinProgress(el);
      }
    });
  });

  // 记录模式切换
  el.querySelectorAll('[data-mode]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      homeMode = btn.dataset.mode;
      save(LS_HOME_MODE, homeMode);
      el.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===homeMode));
      showToast(homeMode==='daily'?'已切换为每日重置模式':'已切换为累积记录模式');
    });
  });

  // 功能入口点击
  el.querySelectorAll('[data-goto]').forEach(item=>{
    item.addEventListener('click',()=>{
      const mid = item.dataset.goto;
      activeModuleId = mid;
      renderAll();
    });
  });

  // 今日计划任务点击（同步到每日计划模块）
  el.querySelectorAll('.home-plan-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const pid = parseInt(item.dataset.planid);
      const task = tasks.find(t=>t.id===pid);
      if(task){
        task.done = !task.done;
        item.classList.toggle('done', task.done);
        const chk = item.querySelector('.home-plan-check');
        if(chk) chk.textContent = task.done?'✅':'⭕';
        save(LS_TASKS, tasks);
        showToast(task.done?'✅ 已完成':'⭕ 已取消');
      }
    });
  });
}

function updateCheckinStreak(){
  const today = todayStr();
  const doneAll = checkinItems.length > 0 && checkinItems.every(i=>i.done);
  if(doneAll){
    if(checkinStreak.lastDate !== today){
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
      const yd = dateStr(yesterday);
      if(checkinStreak.lastDate === yd || checkinStreak.lastDate === ''){
        checkinStreak.count = checkinStreak.lastDate===''?1:checkinStreak.count+1;
      } else {
        checkinStreak.count=1;
      }
      checkinStreak.lastDate = today;
      save(LS_CHECKIN_STREAK, checkinStreak);
    }
  }
}

function refreshCheckinProgress(el){
  const doneCount = checkinItems.filter(i=>i.done).length;
  const total = checkinItems.length;
  const pct = total>0 ? Math.round(doneCount/total*100):0;
  const circ = 2*Math.PI*22;
  const circle = el.querySelector('#checkinProgressCircle');
  if(circle) circle.setAttribute('stroke-dashoffset', circ-(pct/100)*circ);
  const pctText = el.querySelector('.checkin-circle');
  if(pctText && !pctText.querySelector('svg')) pctText.childNodes[0].textContent = pct+'%';
  // 更新统计文字
  const statRows = el.querySelectorAll('.checkin-stat-row');
  if(statRows[0]) statRows[0].innerHTML = `<span>已完成</span><b>${doneCount}/${total}</b>`;
  if(statRows[1]) statRows[1].innerHTML = `<span>完成率</span><b>${pct}%</b>`;
  // 更新连续天数
  const streakEl = el.querySelector('.checkin-streak');
  if(streakEl) streakEl.innerHTML = `🔥 连续 ${checkinStreak.count||0} 天`;
}

// 每日重置检查（如果模式是daily）
function checkDailyReset(){
  if(homeMode !== 'daily') return;
  const lastReset = load('_cw_last_reset','');
  const today = todayStr();
  if(lastReset !== today){
    // 重置打卡项
    checkinItems.forEach(i => i.done = false);
    save(LS_CHECKIN, checkinItems);
    save('_cw_last_reset', today);
  }
}
checkDailyReset();

// ---------- 渲染单个模块 ----------
function renderModule(mid) {
  const container = document.querySelector(`[data-section="${mid}"]`);
  if(!container) return;
  const mod = modules.find(m=>m.id===mid);
  if(!mod) return;

  let html = '';
  switch(mid) {
    case 'home':       html = renderHome(); break;
    case 'daily-plan':  html = renderDailyPlan(); break;
    case 'inspiration': html = renderInspiration(); break;
    case 'hot-remix':   html = renderHotRemix(); break;
    case 'review':      html = renderReview(); break;
    case 'memo':        html = renderMemo(); break;
    case 'finance':     html = renderFinance(); break;
    case 'exercise':    html = renderExercise(); break;
    case 'expression':  html = renderExpression(); break;
    case 'english':     html = renderEnglish(); break;
    default:            html = renderCustomModule(mod); break;
  }

  // 首页模块直接渲染到容器，其他模块渲染到card
  let card;
  if(mid === 'home'){
    container.innerHTML = html;
  } else {
    card = container.querySelector('.card');
    if(card) card.innerHTML = html;
  }

  // 绑定事件
  switch(mid) {
    case 'home':       bindHome(container); break;
    case 'daily-plan':  bindDailyPlan(card); break;
    case 'inspiration': bindInspiration(card); break;
    case 'hot-remix':   bindHotRemix(card); break;
    case 'review':      bindReview(card); break;
    case 'memo':        bindMemo(card); break;
    case 'finance':     try{ bindFinance(card); }catch(e){ console.error('bindFinance error:',e); } break;
    case 'exercise':    bindExercise(card); break;
    case 'expression':  bindExpression(card); break;
    case 'english':     bindEnglish(card); break;
    default:            bindCustomModule(card, mod); break;
  }
}

// ---------- 全部渲染 ----------
function renderAll() {
  renderDrawer();
  const main = $('#mainContent');

  main.innerHTML = modules.map(mod => {
    if(mod.id === 'home'){
      return `<div class="module${mod.id===activeModuleId?' active':''}" data-section="${mod.id}"></div>`;
    }
    return `
    <div class="module${mod.id===activeModuleId?' active':''}" data-section="${mod.id}">
      <div class="module-title">${mod.icon} ${mod.name}</div>
      <div class="card"></div>
    </div>`;
  }).join('');

  // 渲染第一个激活模块
  if(activeModuleId && modules.find(m=>m.id===activeModuleId)) {
    renderModule(activeModuleId);
  } else if(modules.length) {
    activeModuleId = modules[0].id;
    renderModule(activeModuleId);
  }
}

/* ============================================================
   模块管理弹窗
   ============================================================ */
function renderModuleManager() {
  const list = $('#modList');
  list.innerHTML = modules.map(m => `
    <div class="mod-row">
      <span class="mod-icon">${m.icon}</span>
      <span class="mod-name">${m.name}</span>
      ${m.builtin ? '<span style="font-size:11px;color:var(--text3)">内置</span>' :
        `<button class="mod-remove" data-mid="${m.id}" title="删除模块">×</button>`}
    </div>
  `).join('');

  list.querySelectorAll('.mod-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const mid = btn.dataset.mid;
      modules = modules.filter(m=>m.id!==mid);
      // 清理该模块的localStorage
      localStorage.removeItem('cw_custom_'+mid);
      save(LS_MODULES, modules);
      if(activeModuleId === mid) activeModuleId = modules.length ? modules[0].id : '';
      renderAll();
      renderModuleManager();
      showToast('模块已删除');
    });
  });
}

/* ============================================================
   热点数据拉取 — 同源静态文件优先，Gist降级，自动拉取
   ============================================================ */
async function fetchHotData() {
  if(dataFetching) return;
  dataFetching = true;
  const btn = $('#syncBtn');
  if(btn) btn.classList.add('loading');
  // 刷新时立即更新视图显示loading
  renderModule('inspiration');
  renderModule('hot-remix');

  let success = false;

  // 策略1：从同源静态文件拉取（GitHub Pages 上的 inspire.json / remix.json，无限流）
  try {
    const [respI, respR] = await Promise.all([
      fetch('./inspire.json', {cache:'no-store'}),
      fetch('./remix.json', {cache:'no-store'})
    ]);
    if(respI.ok && respR.ok) {
      const iData = await respI.json();
      const rData = await respR.json();
      if(Array.isArray(iData) && iData.length) {
        inspireData = iData; save(LS_INSPIRE, inspireData);
      }
      if(Array.isArray(rData) && rData.length) {
        remixData = rData; save(LS_REMIX, remixData);
      }
      const lastMod = respI.headers.get('last-modified');
      dataUpdatedAt = lastMod ? new Date(lastMod).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      localStorage.setItem('cw_data_updated_at', dataUpdatedAt);
      success = true;
      console.log('[热点] 同源文件拉取成功');
    }
  } catch(e) {
    console.log('[热点] 同源拉取失败，尝试Gist降级:', e.message);
  }

  // 策略2：Gist API 降级（如果同源失败且配了Gist ID）
  if(!success && GIST_ID) {
    try {
      const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`);
      if(resp.ok) {
        const gist = await resp.json();
        const files = gist.files || {};
        const inspireFile = files['inspire.json'] || files['选题灵感.json'];
        const remixFile   = files['remix.json']   || files['二创角度.json'];
        if(inspireFile?.content) {
          const d = JSON.parse(inspireFile.content);
          if(Array.isArray(d) && d.length) { inspireData = d; save(LS_INSPIRE, inspireData); }
        }
        if(remixFile?.content) {
          const d = JSON.parse(remixFile.content);
          if(Array.isArray(d) && d.length) { remixData = d; save(LS_REMIX, remixData); }
        }
        const gistDate = gist.updated_at || gist.created_at;
        dataUpdatedAt = gistDate ? new Date(gistDate).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        localStorage.setItem('cw_data_updated_at', dataUpdatedAt);
        success = true;
        console.log('[热点] Gist降级拉取成功');
      }
    } catch(e) {
      console.log('[热点] Gist降级也失败:', e.message);
    }
  }

  dataFetching = false;
  if(btn) btn.classList.remove('loading');
  renderModule('inspiration');
  renderModule('hot-remix');
  showToast(success ? '✅ 热点已刷新' : '⚠️ 拉取失败，请稍后重试');
}

// 自动拉取：数据为空 或 超过12小时未更新时触发
function autoFetchIfNeeded() {
  if(dataFetching) return;
  const empty = !inspireData.length && !remixData.length;
  let stale = false;
  if(dataUpdatedAt) {
    // 简单判断：如果时间戳不含今天日期则视为过期
    const today = new Date();
    const todayStr = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    if(!dataUpdatedAt.includes(todayStr)) stale = true;
  } else {
    stale = true;
  }
  if(empty || stale) {
    console.log('[热点] 数据为空或过期，自动拉取');
    fetchHotData();
  }
}

$('#syncBtn').addEventListener('click', fetchHotData);

/* ============================================================
   App 唤起
   ============================================================ */
function openDouyin(keyword) {
  const encoded = encodeURIComponent(keyword||'');
  // 优先尝试 URL Scheme，失败则跳网页
  const scheme = `snssdk1128://search?keyword=${encoded}`;
  const fallback = `https://www.douyin.com/search/${encoded}`;
  tryOpen(scheme, fallback);
}
function openXiaohongshu(keyword) {
  const encoded = encodeURIComponent(keyword||'');
  const scheme = `xhsdiscover://search?keyword=${encoded}`;
  const fallback = `https://www.xiaohongshu.com/search_result?keyword=${encoded}`;
  tryOpen(scheme, fallback);
}
function tryOpen(scheme, fallback) {
  const start = Date.now();
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = scheme;
  document.body.appendChild(iframe);
  setTimeout(() => {
    document.body.removeChild(iframe);
    if(Date.now()-start < 2500) {
      window.open(fallback, '_blank');
    }
  }, 2000);
}

// 通用来源链接打开：自动检测平台，优先唤起App，兜底打开网页
function openSourceUrl(url, platform) {
  if(!url) return;
  const lowerUrl = url.toLowerCase();
  const lowerPlat = (platform||'').toLowerCase();

  // 抖音：snssdk1128:// webview
  if(lowerUrl.includes('douyin.com') || lowerPlat.includes('抖音')) {
    const encoded = encodeURIComponent(url);
    tryOpen(`snssdk1128://webview?url=${encoded}`, url);
    return;
  }

  // 小红书：xhsdiscover:// webview
  if(lowerUrl.includes('xiaohongshu.com') || lowerPlat.includes('小红书')) {
    tryOpen(`xhsdiscover://webview?url=${encodeURIComponent(url)}`, url);
    return;
  }

  // 微博：sinaweibo:// 或直接浏览器打开
  if(lowerUrl.includes('weibo.com') || lowerPlat.includes('微博')) {
    tryOpen(`sinaweibo://browser?url=${encodeURIComponent(url)}`, url);
    return;
  }

  // 微信/公众号：浏览器打开（微信url scheme限制多，直接用浏览器更稳妥）
  // 其他链接：直接浏览器打开
  window.open(url, '_blank');
}

/* ============================================================
   工具函数
   ============================================================ */
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tagLabel(t) {
  const map = { trend:'趋势', douyin:'抖音', xhs:'小红书', wechat:'微信' };
  return map[t] || t;
}
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}
